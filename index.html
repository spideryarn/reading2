<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` lets the document use the whole physical screen —
         under the notch, under the home indicator, and (installed, with the
         status-bar style below) under the clock. It is inert on everything that
         has no rounded corners to avoid, and the space it opens up is handed
         back to the chrome by the `--safe-*` tokens in styles.css § tokens.
         Nothing else may assume the viewport starts at a safe pixel.
         docs/plans/260828av-mobile-screen-real-estate.md § 2. -->
    <!-- `interactive-widget=resizes-content` since 2026-09-04: it ASKS the
         browser to let the on-screen keyboard shrink the LAYOUT viewport, so
         `dvh` and `position: fixed` see the room that is actually left. Without
         it the keyboard moves only the visual viewport, every viewport unit
         keeps the full height, and a dialog sized in `dvh` puts its buttons
         underneath the keys — which is what Greg reported from an installed iOS
         app, where there is no accessory bar carrying "Done" to get out of the
         box with either. `.fb-panel` in styles.css is what it was added for.

         **It is a Chromium fix. Do not read it as an iOS one.** WebKit's
         implementation bug is open (bugs.webkit.org/show_bug.cgi?id=259770) and
         what iOS does instead is pan the visual viewport over a layout viewport
         that stays full height. Nobody here has watched this key change anything
         on a phone. The claim that "an installed standalone app resizes on its
         own" stood in this comment for a few hours on 2026-09-04 and was never
         checked by anyone; GPT Sol pointed at it and it is withdrawn.

         What does not depend on the browser honouring it is
         `src/web/useVisualViewport.ts`: the dialogs read `window.visualViewport`
         and place themselves inside the part the reader can see. This key is
         still worth having — where it is honoured it fixes every `dvh` in the
         app at once — but it is the belt, not the braces.

         It had been deferred once, knowingly, as "an app-wide change to how
         every page reacts to a keyboard … not being made blind" (the note on
         `.cmt-dialog`). What changed is that a reader hit the consequence. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Only what the tab says between the first byte and React's first paint.
         Every page sets its own from src/web/page-title.ts — see
         docs/project/page-titles.md — so this is deliberately the bare name
         rather than a guess at which page is about to render. -->
    <!-- **The two `managed-head` comments below are a boundary, not decoration.**

         `composeShell()` in src/public/page-head.ts replaces everything between
         them — the two comments included — and **nothing else**, when the stage
         2 serverless function serves a shared `/read/<slug>` link. That is what
         turns a pasted address into a card with the article's own title and
         gist on it, instead of the bare product name below. See
         docs/plans/260827ai-public-read-only-access.md § Stage 2.

         Two consequences, both easy to get wrong later:

          - **Anything put between them is gone on a shared link.** Tags that
            must survive — the referrer policy, the icons, the manifest, the
            viewport — belong outside, where they are.
          - **Each comment must appear exactly once in this file.** The function
            asserts it and refuses to compose otherwise, and so does the build
            check in scripts/client-shell.ts, so a duplicate is a failed build
            rather than a head assembled from the wrong halves. That is also why
            neither marker's full text is written out in this prose.

         The build compiles `dist/index.html` into the function, so a change here
         reaches production only through `npm run build`; the API build refuses a
         stale one. `npm run dev` never loads that config, so locally the head
         below is simply what you get. -->
    <!-- spideryarn:managed-head:start -->
    <title>Spideryarn</title>
    <meta name="description" content="AI-assisted reading: an article at whatever level of detail you need." />
    <!-- Belt and braces, and it changes nothing today: the `X-Robots-Tag`
         header Vercel sets already says exactly this for every path, and
         public/robots.txt still says `Disallow: /`. It is here for the day the
         header is narrowed so that shared articles can be indexed — at which
         point a `/read/` URL that somehow missed the rewrite would otherwise be
         indexable by accident. Fail closed: a document that says nothing about
         robots is a document that may be indexed. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- spideryarn:managed-head:end -->
    <!-- **No referrer, from any page of this app, to anywhere.**

         Settled in docs/plans/260827ai-public-read-only-access.md § Stage 1 and then not
         built until GPT Sol's second pass found it missing, 2026-08-28. It
         matters because a shared article is read by strangers and its own HTML
         carries third-party images and embeds: without this, an image host
         learns the exact URL of the article somebody is reading, and so does
         every outbound link they follow. `/read/<slug>?at=<block>` is reading
         state as well as an address.

         Here as well as in vercel.json, and the duplication is the point. The
         header is set by Vercel's edge and applies only where Vercel serves;
         this applies wherever the document is served from — the dev server, a
         preview, a copy somebody saved. A document-level policy also covers
         subresources the header would, and neither one depends on the other
         being right. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- **Add to Home Screen is the only way to be rid of the browser's own
         chrome**, and on iOS that is worth more screen than any CSS: the
         collapsed address strip in portrait and the vertical button strip in
         landscape are both Chrome's, and no page can hide either.
         docs/plans/260828av-mobile-screen-real-estate.md § 1.

         iOS 16.4+ reads `display: standalone` out of the manifest, but older
         iOS and several in-app browsers read only the meta tag, so both are
         here. `mobile-web-app-capable` is the standard spelling of the same
         thing; Chrome warns if only the `apple-` one is present.

         `black-translucent` is the one value that starts the web view at y=0
         with the clock drawn over it — Greg chose to reclaim that strip,
         2026-08-28. It only does anything alongside `viewport-fit=cover`
         above, and it is why every piece of fixed chrome in styles.css has a
         `--safe-top` term. Change this to `black` and those terms go to zero on
         their own; change it the other way with the terms missing and the
         granularity pills end up under the time. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The name under the icon. Without it iOS uses <title>, which is the bare
         product name today and a page title tomorrow — see page-titles.md. -->
    <meta name="apple-mobile-web-app-title" content="Spideryarn" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Dark only, and said here as well as in tokens.css so the browser paints its
         canvas dark before the stylesheet loads — otherwise a white flash. -->
    <meta name="color-scheme" content="dark" />
  </head>
  <body>
    <div id="root"></div>
    <!-- boot.tsx, not main.tsx — it starts error reporting and then imports the
         app *dynamically*, so a module that throws while evaluating is still
         reported rather than being a blank page. See src/web/boot.tsx. -->
    <script type="module" src="/src/web/boot.tsx"></script>
  </body>
</html>
