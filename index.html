<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Only what the tab says between the first byte and React's first paint.
         Every page sets its own from src/web/page-title.ts — see
         docs/project/page-titles.md — so this is deliberately the bare name
         rather than a guess at which page is about to render. -->
    <title>Spideryarn</title>
    <meta name="description" content="AI-assisted reading: an article at whatever level of detail you need." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Dark only, and said here as well as in tokens.css so the browser paints its
         canvas dark before the stylesheet loads — otherwise a white flash. -->
    <meta name="color-scheme" content="dark" />
  </head>
  <body>
    <div id="root"></div>
    <!-- boot.tsx, not main.tsx — it starts error reporting and then imports the
         app *dynamically*, so a module that throws while evaluating is still
         reported rather than being a blank page. See src/web/boot.tsx. -->
    <script type="module" src="/src/web/boot.tsx"></script>
  </body>
</html>
