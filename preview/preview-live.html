<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live conversation spike</title>
    <meta name="color-scheme" content="dark" />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #14161a; color: #e6e6e6;
             font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif; }
      main { max-width: 44rem; margin: 0 auto; padding: 2rem 1.25rem 6rem; }
      h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
      h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em;
           color: #8b93a1; margin: 1.75rem 0 .5rem; }
      .sub { color: #8b93a1; margin: 0 0 1.25rem; }
      code { background: #1d2027; padding: .1em .35em; border-radius: 3px; font-size: .9em; }
      .row { display: flex; gap: .5rem; margin: 0 0 .75rem; flex-wrap: wrap; }
      button { background: #2a2f3a; color: #e6e6e6; border: 1px solid #3a4150;
               border-radius: 6px; padding: .45rem .9rem; font: inherit; cursor: pointer; }
      button:disabled { opacity: .4; cursor: default; }
      input { flex: 1; min-width: 12rem; background: #1d2027; color: #e6e6e6;
              border: 1px solid #3a4150; border-radius: 6px; padding: .45rem .6rem; font: inherit; }
      .err { color: #ff9d9d; background: #2a1a1a; border: 1px solid #55302f;
             border-radius: 6px; padding: .6rem .8rem; white-space: pre-wrap; }
      .line { margin: .35rem 0; }
      .line.reader b { color: #8fd0ff; }
      .line.companion b { color: #b9e6a8; }
      .quiet { color: #6b7280; }
      .pill { margin-left: .5rem; border-radius: 999px; padding: .1em .6em; font-size: .8em; }
      .pill.hear { background: #1f3a52; color: #8fd0ff; }
      .pill.speak { background: #22401d; color: #b9e6a8; }
      .placement { display: flex; align-items: center; gap: .4rem; color: #8b93a1; font-size: .9em; }
      .placement select { background: #1d2027; color: #e6e6e6; border: 1px solid #3a4150;
                          border-radius: 6px; padding: .4rem .5rem; font: inherit; }
      .placement select:disabled { opacity: .4; }
      pre { background: #1d2027; border-radius: 6px; padding: .75rem; overflow-x: auto;
            font-size: .85em; color: #a8b0bd; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/preview-live.tsx"></script>
  </body>
</html>
