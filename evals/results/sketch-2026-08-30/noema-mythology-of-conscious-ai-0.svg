<text x="16" y="24" font-size="17" fill="#f7f7f7" font-weight="600">Overview: temptation, argument, ethics, loop</text><text x="16" y="42" font-size="11.5" fill="#b8b8b8">Two converging clusters (why we're tempted; why we should doubt it) lead into a fork of distinct risks, which closes by</text>
<text x="16" y="56.95" font-size="11.5" fill="#b8b8b8">returning to the opening stakes.</text>
<g transform="translate(0 71.9)">
