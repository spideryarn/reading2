<path d="M520 1115 C752 1115 752 75 480 75" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
<polygon points="480,75 490,71.5 490,78.5" fill="rgba(201,201,201,0.8)" stroke="none"/>
<g>
<title>Could AI really be conscious? — and why it would matter — Consciousness brings moral status; getting this wrong distorts ethics either way.</title>
<ellipse cx="380" cy="75" rx="100" ry="35" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="63.09" font-size="15" text-anchor="middle" fill="#f7f7f7">Could AI really be</text>
<text x="380" y="81.84" font-size="15" text-anchor="middle" fill="#f7f7f7">conscious?</text>
<text x="380" y="102.3" font-size="11.4" text-anchor="middle" fill="#8f8f8f">and why it would matter</text>
</g>
<g>
<title>Anthropocentrism &amp; exceptionalism — human traits as the template — Three overlapping biases make us see human qualities as definitional.</title>
<rect x="40" y="170" width="200" height="80" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="140" y="200.472" font-size="12" text-anchor="middle" fill="#f7f7f7">Anthropocentrism &amp;</text>
<text x="140" y="215.472" font-size="12" text-anchor="middle" fill="#f7f7f7">exceptionalism</text>
<text x="140" y="231.84" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">human traits as the template</text>
</g>
<g>
<title>Fluent language reads as feeling — 'hallucinate' vs 'confabulate' — LLMs pull our strings via language; AlphaFold doesn't, though it's similar under the hood.</title>
<rect x="280" y="170" width="200" height="80" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="380" y="200.472" font-size="12" text-anchor="middle" fill="#f7f7f7">Fluent language reads as</text>
<text x="380" y="215.472" font-size="12" text-anchor="middle" fill="#f7f7f7">feeling</text>
<text x="380" y="231.84" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">'hallucinate' vs 'confabulate'</text>
</g>
<g>
<title>Exponential hype &amp; techno-rapture — every point feels like a threshold — Exponential curves and dreams of digital immortality inflate expectations.</title>
<rect x="520" y="170" width="200" height="80" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="620" y="200.472" font-size="12" text-anchor="middle" fill="#f7f7f7">Exponential hype &amp;</text>
<text x="620" y="215.472" font-size="12" text-anchor="middle" fill="#f7f7f7">techno-rapture</text>
<text x="620" y="231.84" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">every point feels like a threshold</text>
</g>
<g>
<title>Mostly pareidolia — but that's only step one — Recognizing the bias doesn't settle whether real artificial consciousness is possible.</title>
<polygon points="275,280 485,280 520,315 485,350 275,350 240,315" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="380" y="310.5" font-size="15" text-anchor="middle" fill="#f7f7f7">Mostly pareidolia — but that's</text>
<text x="380" y="329.25" font-size="15" text-anchor="middle" fill="#f7f7f7">only step one</text>
</g>
<g>
<title>Assumes: computation = consciousness — computational functionalism — The whole case for conscious AI rests on this usually-unexamined assumption.</title>
<polygon points="380,395 480,427.5 380,460 280,427.5" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="410.472" font-size="12" text-anchor="middle" fill="#f7f7f7">Assumes:</text>
<text x="380" y="425.472" font-size="12" text-anchor="middle" fill="#f7f7f7">computation =</text>
<text x="380" y="440.472" font-size="12" text-anchor="middle" fill="#f7f7f7">consciousness</text>
<text x="380" y="456.84" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">computati-</text>
</g>
<g>
<title>Brains aren't software on hardware — No clean separation of mindware and wetware exists in real brains.</title>
<rect x="30" y="525" width="155" height="95" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="107.5" y="569.5" font-size="10" text-anchor="middle" fill="#f7f7f7">Brains aren't software on</text>
<text x="107.5" y="582" font-size="10" text-anchor="middle" fill="#f7f7f7">hardware</text>
</g>
<g>
<title>Other dynamics beyond Turing computation — Continuous, analogue, and dynamical processes may matter more than algorithms.</title>
<rect x="205" y="525" width="155" height="95" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="282.5" y="569.5" font-size="10" text-anchor="middle" fill="#f7f7f7">Other dynamics beyond</text>
<text x="282.5" y="582" font-size="10" text-anchor="middle" fill="#f7f7f7">Turing computation</text>
</g>
<g>
<title>Life itself may be necessary — Consciousness may be tied to self-sustaining, living, predictive bodies.</title>
<rect x="380" y="525" width="155" height="95" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="457.5" y="569.5" font-size="10" text-anchor="middle" fill="#f7f7f7">Life itself may be</text>
<text x="457.5" y="582" font-size="10" text-anchor="middle" fill="#f7f7f7">necessary</text>
</g>
<g>
<title>Simulating a mind ≠ creating one — A simulated storm doesn't get anything wet; mind-uploading assumes its conclusion.</title>
<rect x="555" y="525" width="155" height="95" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="632.5" y="569.5" font-size="10" text-anchor="middle" fill="#f7f7f7">Simulating a mind ≠</text>
<text x="632.5" y="582" font-size="10" text-anchor="middle" fill="#f7f7f7">creating one</text>
</g>
<g>
<title>Functionalism looks shaky, not impossible — Each argument stands alone but together they weaken the case for conscious AI.</title>
<polygon points="277.5,650 482.5,650 520,687.5 482.5,725 277.5,725 240,687.5" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="380" y="683" font-size="15" text-anchor="middle" fill="#f7f7f7">Functionalism looks shaky, not</text>
<text x="380" y="701.75" font-size="15" text-anchor="middle" fill="#f7f7f7">impossible</text>
</g>
<g>
<title>Given the uncertainty, don't build it — Deliberately creating conscious AI would risk new, uncontrollable suffering.</title>
<polygon points="380,790 480,822.5 380,855 280,822.5" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="818.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Given the uncertainty,</text>
<text x="380" y="833.9" font-size="12" text-anchor="middle" fill="#f7f7f7">don't build it</text>
</g>
<g>
<title>If AI really is conscious: disaster — new suffering, hard to switch off — Rights would make dangerous systems harder to control or shut down.</title>
<rect x="80" y="920" width="260" height="85" rx="4" fill="rgba(240,228,66,0.16)" stroke="rgba(240,228,66,0.62)" stroke-width="1.2"/>
<text x="210" y="960.472" font-size="12" text-anchor="middle" fill="#f7f7f7">If AI really is conscious: disaster</text>
<text x="210" y="976.84" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">new suffering, hard to switch off</text>
</g>
<g>
<title>If it only seems conscious: illusion persists — no test can settle it — Like a visual illusion, the feeling of AI consciousness survives knowing better.</title>
<rect x="420" y="920" width="260" height="85" rx="4" fill="rgba(240,228,66,0.16)" stroke="rgba(240,228,66,0.62)" stroke-width="1.2"/>
<text x="550" y="952.972" font-size="12" text-anchor="middle" fill="#f7f7f7">If it only seems conscious: illusion</text>
<text x="550" y="967.972" font-size="12" text-anchor="middle" fill="#f7f7f7">persists</text>
<text x="550" y="984.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">no test can settle it</text>
</g>
<g>
<title>Recover a soul that's more breath than machine — embodied, not disembodied rationality — Mistaking algorithms for minds means overestimating them and underestimating ourselves.</title>
<ellipse cx="380" cy="1115" rx="140" ry="45" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="1103.09" font-size="15" text-anchor="middle" fill="#f7f7f7">Recover a soul that's more</text>
<text x="380" y="1121.84" font-size="15" text-anchor="middle" fill="#f7f7f7">breath than machine</text>
<text x="380" y="1142.3" font-size="11.4" text-anchor="middle" fill="#8f8f8f">embodied, not disembodied rationality</text>
</g>
<text x="30" y="145" font-size="11" text-anchor="start" fill="rgba(232,112,58,0.95)" font-weight="500" letter-spacing="0.07em">WHY WE'RE TEMPTED TO SEE IT</text>
<text x="30" y="500" font-size="11" text-anchor="start" fill="rgba(47,191,149,0.95)" font-weight="500" letter-spacing="0.07em">FOUR ARGUMENTS AGAINST THAT ASSUMPTION</text>
<text x="30" y="895" font-size="11" text-anchor="start" fill="rgba(240,228,66,0.95)" font-weight="500" letter-spacing="0.07em">TWO DISTINCT RISKS</text>
<rect x="610.2" y="704.7350400000003" width="145.8" height="14" rx="3" fill="#252525" stroke="none"/>
<text x="683.1" y="714.7350400000003" font-size="10" text-anchor="middle" fill="#8f8f8f">echoes the opening warning</text>
</g>
</svg>