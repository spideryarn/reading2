<polygon points="210,920 206.5,910 213.5,910" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M380 855 C380 884.25 550 890.75 550 920" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
