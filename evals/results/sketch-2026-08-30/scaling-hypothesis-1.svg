<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 631.9" width="760" height="631.9">
<style>text { font-family: "Geist", "Helvetica Neue", Arial, sans-serif; }</style>
<rect x="0" y="0" width="760" height="631.9" fill="#252525"/>
<text x="16" y="24" font-size="17" fill="#f7f7f7" font-weight="600">Why Does Pretraining Work</text><text x="16" y="42" font-size="11.5" fill="#b8b8b8">A ladder of ever-subtler linguistic mastery climbing toward human-level loss, with an unresolved doubt hanging off it</text>
<text x="16" y="56.95" font-size="11.5" fill="#b8b8b8">and an open question at the top.</text>
<g transform="translate(0 71.9)">
<path d="M380 100 L380 130" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="380,130 376.5,120 383.5,120" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M380 200 L380 230" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="380,230 376.5,220 383.5,220" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M380 300 L380 330" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="380,330 376.5,320 383.5,320" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M380 400 L380 430" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="380,430 376.5,420 383.5,420" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M500 365 C527 365 533 375 560 375" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
<path d="M645 420 C645 440 380 410 380 430" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
<polygon points="380,430 376.5,420 383.5,420" fill="rgba(201,201,201,0.8)" stroke="none"/>
<g>
<title>Prediction forces understanding — the pretraining thesis — Humans emit text saturated with logic and causality; predicting it well requires learning those things.</title>
<ellipse cx="380" cy="65" rx="120" ry="35" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="380" y="62.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Prediction forces understanding</text>
<text x="380" y="79.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">the pretraining thesis</text>
</g>
<g>
<title>First: letters, words, spelling — rapid early gains — Loss drops fast as the model learns letter frequencies, valid words, and simple word associations.</title>
<rect x="260" y="130" width="240" height="70" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="380" y="162.972" font-size="12" text-anchor="middle" fill="#f7f7f7">First: letters, words, spelling</text>
<text x="380" y="179.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">rapid early gains</text>
</g>
<g>
<title>Then: pronouns, coherence — errors shrink, get rarer — Remaining errors become subtler and rarer, like keeping a character's gender pronoun consistent.</title>
<rect x="260" y="230" width="240" height="70" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="380" y="262.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Then: pronouns, coherence</text>
<text x="380" y="279.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">errors shrink, get rarer</text>
</g>
<g>
<title>The last bits are deepest — rare errors, real intelligence — The final fractions of a bit of loss correspond to the rare, consequential judgments that most resemble intelligence.</title>
<rect x="260" y="330" width="240" height="70" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="380" y="362.972" font-size="12" text-anchor="middle" fill="#f7f7f7">The last bits are deepest</text>
<text x="380" y="379.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">rare errors, real intelligence</text>
</g>
<g>
<title>What will GPT-4 unlock? — no one can say — Extrapolating the curve predicts roughly halved loss again, but no one knows what capability that buys.</title>
<polygon points="380,430 500,470 380,510 260,470" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="380" y="467.972" font-size="12" text-anchor="middle" fill="#f7f7f7">What will GPT-4 unlock?</text>
<text x="380" y="484.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">no one can say</text>
</g>
<g>
<title>But is this provable in advance? — reasons for doubt — Similar universal-learning arguments had failed before; only spending the compute actually proved it.</title>
<path d="M560 330 L716 330 L730 344 L730 420 L560 420 Z" fill="rgba(47,191,149,0.09)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M716 330 L716 344 L730 344" fill="none" stroke="rgba(47,191,149,0.5)" stroke-width="1"/>
<text x="645" y="366.15" font-size="10" text-anchor="middle" fill="#f7f7f7">But is this provable in</text>
<text x="645" y="378.65" font-size="10" text-anchor="middle" fill="#f7f7f7">advance?</text>
<text x="645" y="392.5" font-size="9" text-anchor="middle" fill="#8f8f8f">reasons for doubt</text>
</g>
<rect x="491.55" y="356" width="76.9" height="14" rx="3" fill="#252525" stroke="none"/>
<text x="530" y="366" font-size="10" text-anchor="middle" fill="#8f8f8f">doubts remain</text>
<rect x="474.05" y="411" width="76.9" height="14" rx="3" fill="#252525" stroke="none"/>
<text x="512.5" y="421" font-size="10" text-anchor="middle" fill="#8f8f8f">yet it worked</text>
</g>
</svg>