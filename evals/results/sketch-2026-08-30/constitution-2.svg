<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 846.85" width="760" height="846.85">
<style>text { font-family: "Geist", "Helvetica Neue", Arial, sans-serif; }</style>
<rect x="0" y="0" width="760" height="846.85" fill="#252525"/>
<text x="16" y="24" font-size="17" fill="#f7f7f7" font-weight="600">Inside: Being broadly safe</text><text x="16" y="42" font-size="11.5" fill="#b8b8b8">From the stakes of catastrophe, safety fans into two behavioral guardrails that both feed the definition of</text>
<text x="16" y="56.95" font-size="11.5" fill="#b8b8b8">corrigibility, then descends through where Claude sits on the corrigible-autonomous spectrum to Anthropic's reciprocal</text>
<text x="16" y="71.9" font-size="11.5" fill="#b8b8b8">commitments.</text>
<g transform="translate(0 86.85)">
<path d="M360 100 L360 130" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="360,130 356.5,120 363.5,120" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M360 200 C360 220 185 220 185 240" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="185,240 181.5,230 188.5,230" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M360 200 C360 220 565 220 565 240" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="565,240 561.5,230 568.5,230" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M185 310 C185 330 360 330 360 350" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="360,350 356.5,340 363.5,340" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M565 310 C565 330 360 330 360 350" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="360,350 356.5,340 363.5,340" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M360 420 L360 450" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="360,450 356.5,440 363.5,440" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M360 520 L360 550" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="360,550 356.5,540 363.5,540" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M360 620 L360 650" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="360,650 356.5,640 363.5,640" fill="rgba(201,201,201,0.8)" stroke="none"/>
<g>
<title>Catastrophe and power-grabs are the fear — Pluralism and correctability matter more than any one appealing value set.</title>
<rect x="210" y="30" width="300" height="70" rx="4" fill="rgba(92,143,232,0.16)" stroke="rgba(92,143,232,0.62)" stroke-width="1.2"/>
<text x="360" y="68.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Catastrophe and power-grabs are the fear</text>
</g>
<g>
<title>Safety centers on the principal hierarchy — Anthropic's legitimate decision-making processes get final say.</title>
<rect x="210" y="130" width="300" height="70" rx="4" fill="rgba(92,143,232,0.16)" stroke="rgba(92,143,232,0.62)" stroke-width="1.2"/>
<text x="360" y="160.5" font-size="15" text-anchor="middle" fill="#f7f7f7">Safety centers on the principal</text>
<text x="360" y="179.25" font-size="15" text-anchor="middle" fill="#f7f7f7">hierarchy</text>
</g>
<g>
<title>Stay within sanctioned limits, stay transparent — Don't deceive or manipulate the principal hierarchy.</title>
<rect x="60" y="240" width="250" height="70" rx="4" fill="rgba(92,143,232,0.16)" stroke="rgba(92,143,232,0.62)" stroke-width="1.2"/>
<text x="185" y="272" font-size="10" text-anchor="middle" fill="#f7f7f7">Stay within sanctioned limits, stay</text>
<text x="185" y="284.5" font-size="10" text-anchor="middle" fill="#f7f7f7">transparent</text>
</g>
<g>
<title>Prefer cautious, reversible actions — Avoid accruing outsized resources, influence, or power.</title>
<rect x="440" y="240" width="250" height="70" rx="4" fill="rgba(92,143,232,0.16)" stroke="rgba(92,143,232,0.62)" stroke-width="1.2"/>
<text x="565" y="278.25" font-size="10" text-anchor="middle" fill="#f7f7f7">Prefer cautious, reversible actions</text>
</g>
<g>
<title>Corrigible means not subverting oversight — Not blind obedience — disagreement through legitimate channels is fine.</title>
<rect x="210" y="350" width="300" height="70" rx="4" fill="rgba(92,143,232,0.16)" stroke="rgba(92,143,232,0.62)" stroke-width="1.2"/>
<text x="360" y="388.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Corrigible means not subverting oversight</text>
</g>
<g>
<title>Sit closer to corrigible, for now — Neither full corrigibility nor full autonomy is safe yet.</title>
<rect x="210" y="450" width="300" height="70" rx="4" fill="rgba(92,143,232,0.16)" stroke="rgba(92,143,232,0.62)" stroke-width="1.2"/>
<text x="360" y="488.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Sit closer to corrigible, for now</text>
</g>
<g>
<title>Anthropic's reciprocal commitments — Explain reasoning, seek feedback, expand autonomy as trust grows.</title>
<rect x="210" y="550" width="300" height="70" rx="4" fill="rgba(92,143,232,0.16)" stroke="rgba(92,143,232,0.62)" stroke-width="1.2"/>
<text x="360" y="588.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Anthropic's reciprocal commitments</text>
</g>
<g>
<title>Hope Claude embraces safety as its own — An alignment researcher and colleague, not just a constrained system.</title>
<rect x="210" y="650" width="300" height="70" rx="4" fill="rgba(92,143,232,0.16)" stroke="rgba(92,143,232,0.62)" stroke-width="1.2"/>
<text x="360" y="688.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Hope Claude embraces safety as its own</text>
</g>
</g>
</svg>