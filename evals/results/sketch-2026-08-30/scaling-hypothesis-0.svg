<polygon points="230,245 220,248.5 220,241.5" fill="rgba(201,201,201,0.8)" stroke="none"/>
<g>
<title>GPT-3 arrives — 175B params, meta-learning appears — A straightforward scale-up of GPT-2 unexpectedly learns to learn from examples alone.</title>
<ellipse cx="380" cy="125" rx="150" ry="45" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="380" y="122.465" font-size="15" text-anchor="middle" fill="#f7f7f7">GPT-3 arrives</text>
<text x="380" y="142.925" font-size="11.4" text-anchor="middle" fill="#8f8f8f">175B params, meta-learning appears</text>
</g>
<g>
<title>Scale alone breeds intelligence — the blessings of scale, generalized — Across vision, games, robotics, and language, bigger models+data+compute reliably yield generalization and meta-learning.</title>
<rect x="230" y="200" width="300" height="90" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="380" y="242.465" font-size="15" text-anchor="middle" fill="#f7f7f7">Scale alone breeds intelligence</text>
<text x="380" y="262.925" font-size="11.4" text-anchor="middle" fill="#8f8f8f">the blessings of scale, generalized</text>
</g>
<g>
<title>Why pretraining works — loss reduction tracks understanding — Minimizing next-token loss forces a model from letter statistics toward genuine world-modeling.</title>
<polygon points="275,320 485,320 530,365 485,410 275,410 230,365" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="380" y="362.465" font-size="15" text-anchor="middle" fill="#f7f7f7">Why pretraining works</text>
<text x="380" y="382.92499999999995" font-size="11.4" text-anchor="middle" fill="#8f8f8f">loss reduction tracks understanding</text>
</g>
<g>
<title>Will anyone scale further? — hardware is ready; will is not — DeepMind and Google Brain have the compute but not the conviction to bet everything on scale.</title>
<polygon points="380,510 530,555 380,600 230,555" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="380" y="552.465" font-size="15" text-anchor="middle" fill="#f7f7f7">Will anyone scale further?</text>
<text x="380" y="572.9250000000001" font-size="11.4" text-anchor="middle" fill="#8f8f8f">hardware is ready; will is not</text>
</g>
<g>
<title>Critics keep being wrong — a decade of failed predictions — Confident 'AI winter' forecasts from respected experts were repeatedly falsified by events.</title>
<rect x="230" y="630" width="300" height="90" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="380" y="672.465" font-size="15" text-anchor="middle" fill="#f7f7f7">Critics keep being wrong</text>
<text x="380" y="692.9250000000001" font-size="11.4" text-anchor="middle" fill="#8f8f8f">a decade of failed predictions</text>
</g>
<g>
<title>Agency leaks in from data — GPT-3 learns to roleplay agents — Training on human-generated text inevitably teaches a model to imitate goal-pursuing agents.</title>
<rect x="230" y="800" width="300" height="90" rx="4" fill="rgba(240,228,66,0.16)" stroke="rgba(240,228,66,0.62)" stroke-width="1.2"/>
<text x="380" y="842.465" font-size="15" text-anchor="middle" fill="#f7f7f7">Agency leaks in from data</text>
<text x="380" y="862.9250000000001" font-size="11.4" text-anchor="middle" fill="#8f8f8f">GPT-3 learns to roleplay agents</text>
</g>
<g>
<title>Even formal systems tempt it — cellular automata, Turing machines — Agency-like inference appears even when training on abstract rule systems with no agents at all.</title>
<rect x="230" y="920" width="300" height="90" rx="4" fill="rgba(240,228,66,0.16)" stroke="rgba(240,228,66,0.62)" stroke-width="1.2"/>
<text x="380" y="962.465" font-size="15" text-anchor="middle" fill="#f7f7f7">Even formal systems tempt it</text>
<text x="380" y="982.9250000000001" font-size="11.4" text-anchor="middle" fill="#8f8f8f">cellular automata, Turing machines</text>
</g>
