<rect x="24" y="460" width="712" height="280" rx="8" fill="rgba(47,191,149,0.07)" stroke="rgba(47,191,149,0.24)" stroke-width="1"/>
<text x="34" y="475" font-size="11" text-anchor="start" fill="rgba(47,191,149,0.95)" font-weight="500" letter-spacing="0.07em">WHO WILL ACT ON IT</text>
<rect x="24" y="750" width="712" height="290" rx="8" fill="rgba(240,228,66,0.07)" stroke="rgba(240,228,66,0.24)" stroke-width="1"/>
<text x="34" y="765" font-size="11" text-anchor="start" fill="rgba(240,228,66,0.95)" font-weight="500" letter-spacing="0.07em">APPENDIX: DOES AGENCY EMERGE TOO?</text>
