<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1231.9" width="760" height="1231.9">
<style>text { font-family: "Geist", "Helvetica Neue", Arial, sans-serif; }</style>
<rect x="0" y="0" width="760" height="1231.9" fill="#252525"/>
<text x="16" y="24" font-size="17" fill="#f7f7f7" font-weight="600">The Scaling Hypothesis</text><text x="16" y="42" font-size="11.5" fill="#b8b8b8">GPT-3's results build a case for scale, which is explained, then tested against who will actually act on it and</text>
<text x="16" y="56.95" font-size="11.5" fill="#b8b8b8">vindicated by a decade of wrong predictions — before the same logic is turned on agency itself.</text>
<g transform="translate(0 71.9)">
<rect x="24" y="40" width="712" height="410" rx="8" fill="rgba(232,112,58,0.07)" stroke="rgba(232,112,58,0.24)" stroke-width="1"/>
