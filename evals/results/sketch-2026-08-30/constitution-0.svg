<polygon points="380,520 376.5,510 383.5,510" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M530 560 C552.5 560 557.5 560 580 560" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
<polygon points="580,560 570,563.5 570,556.5" fill="rgba(201,201,201,0.8)" stroke="none"/>
