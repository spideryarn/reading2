<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1011.9" width="760" height="1011.9">
<style>text { font-family: "Geist", "Helvetica Neue", Arial, sans-serif; }</style>
<rect x="0" y="0" width="760" height="1011.9" fill="#252525"/>
<text x="16" y="24" font-size="17" fill="#f7f7f7" font-weight="600">Overview</text><text x="16" y="42" font-size="11.5" fill="#b8b8b8">A chain running through Anthropic's four ranked priorities and the parts that elaborate each, ending in a loop back to</text>
<text x="16" y="56.95" font-size="11.5" fill="#b8b8b8">the opening claim that Claude should genuinely own these values.</text>
<g transform="translate(0 71.9)">
