<path d="M530 670 C552.5 670 557.5 670 580 670" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
<polygon points="580,670 570,673.5 570,666.5" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M380 710 L380 740" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="380,740 376.5,730 383.5,730" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M530 775 C552.5 775 557.5 775 580 775" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
<polygon points="580,775 570,778.5 570,771.5" fill="rgba(201,201,201,0.8)" stroke="none"/>
