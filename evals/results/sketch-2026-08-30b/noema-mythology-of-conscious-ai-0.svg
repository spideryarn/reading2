<text x="16" y="24" font-size="17" fill="#f7f7f7" font-weight="600">Overview</text><text x="16" y="42" font-size="11.5" fill="#b8b8b8">The essay funnels psychological biases into 'pareidolia', funnels four technical arguments into 'functionalism looks</text>
<text x="16" y="56.95" font-size="11.5" fill="#b8b8b8">shaky', forks the resulting uncertainty into two live ethical risks, then loops back to the human question it opened</text>
<text x="16" y="71.9" font-size="11.5" fill="#b8b8b8">with.</text>
