<g>
<title>Does AI consciousness matter? — With consciousness comes moral status, rights, and the risk of suffering — for AI and for us.</title>
<ellipse cx="380" cy="75" rx="150" ry="35" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="79.875" font-size="15" text-anchor="middle" fill="#f7f7f7">Does AI consciousness matter?</text>
</g>
<g>
<title>Human-centered biases — anthropocentrism, exceptionalism, anthropomorphism — Three overlapping biases make us project mind onto anything humanlike.</title>
<rect x="40" y="190" width="210" height="80" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="145" y="227.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Human-centered biases</text>
<text x="145" y="244.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">anthropocentrism, exceptionalism…</text>
</g>
<g>
<title>Fluent language feels human — Saying chatbots 'hallucinate' quietly implies they experience things.</title>
<rect x="275" y="190" width="210" height="80" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="380" y="233.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Fluent language feels human</text>
</g>
<g>
<title>Techno-hype &amp; rapture dreams — Exponential growth and Promethean ambition make imminent machine minds feel inevitable.</title>
<rect x="510" y="190" width="210" height="80" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="615" y="233.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Techno-hype &amp; rapture dreams</text>
</g>
<g>
<title>Pareidolia, not evidence — Seeing consciousness in AI may be like seeing a face in a cinnamon bun.</title>
<polygon points="265,350 495,350 530,385 495,420 265,420 230,385" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="380" y="389.875" font-size="15" text-anchor="middle" fill="#f7f7f7">Pareidolia, not evidence</text>
</g>
<g>
<title>Brains aren't computers — No clean software/hardware split exists in living neural tissue.</title>
<rect x="34" y="510" width="150" height="90" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="109" y="551.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Brains aren't</text>
<text x="109" y="566.4" font-size="12" text-anchor="middle" fill="#f7f7f7">computers</text>
</g>
<g>
<title>More than algorithms — Analogue, continuous, dynamical processes may matter beyond Turing computation.</title>
<rect x="214" y="510" width="150" height="90" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="289" y="558.9" font-size="12" text-anchor="middle" fill="#f7f7f7">More than algorithms</text>
</g>
<g>
<title>Life may be necessary — Consciousness may be tied to self-sustaining, living, metabolic processes.</title>
<rect x="394" y="510" width="150" height="90" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="469" y="558.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Life may be necessary</text>
</g>
<g>
<title>Simulating ≠ creating — A simulated storm doesn't get anything wet; a simulated brain may not feel.</title>
<rect x="574" y="510" width="150" height="90" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="649" y="558.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Simulating ≠ creating</text>
</g>
<g>
<title>Functionalism looks shaky — Four independent arguments converge, though none is a knock-down proof.</title>
<polygon points="265,670 495,670 530,705 495,740 265,740 230,705" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="380" y="709.875" font-size="15" text-anchor="middle" fill="#f7f7f7">Functionalism looks shaky</text>
</g>
<g>
<title>Deep uncertainty remains — No one can say for sure what would create, or avoid, real machine consciousness.</title>
<path d="M230 780 L516 780 L530 794 L530 850 L230 850 Z" fill="rgba(240,228,66,0.09)" stroke="rgba(240,228,66,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M516 780 L516 794 L530 794" fill="none" stroke="rgba(240,228,66,0.5)" stroke-width="1"/>
<text x="380" y="818.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Deep uncertainty remains</text>
</g>
<g>
<title>Don't deliberately create conscious AI — Doing so risks introducing new moral subjects and new suffering at scale.</title>
<rect x="60" y="890" width="290" height="90" rx="4" fill="rgba(240,228,66,0.16)" stroke="rgba(240,228,66,0.62)" stroke-width="1.2"/>
<text x="205" y="938.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Don't deliberately create conscious AI</text>
</g>
<g>
<title>Conscious-seeming AI is already here — Illusory consciousness poses its own distinct, present-day ethical risks.</title>
<rect x="410" y="890" width="290" height="90" rx="4" fill="rgba(240,228,66,0.16)" stroke="rgba(240,228,66,0.62)" stroke-width="1.2"/>
<text x="555" y="938.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Conscious-seeming AI is already here</text>
</g>
<g>
<title>Recovering an embodied sense of self — More breath than thought, more meat than machine — a return to what makes us us.</title>
<ellipse cx="380" cy="1050" rx="150" ry="40" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="1054.875" font-size="15" text-anchor="middle" fill="#f7f7f7">Recovering an embodied sense of self</text>
</g>
<text x="34" y="165" font-size="11" text-anchor="start" fill="rgba(232,112,58,0.95)" font-weight="500" letter-spacing="0.07em">WHY WE'RE TEMPTED TO SEE IT</text>
<text x="34" y="485" font-size="11" text-anchor="start" fill="rgba(47,191,149,0.95)" font-weight="500" letter-spacing="0.07em">WHY IT'S PROBABLY NOT THERE</text>
<rect x="293.4" y="451" width="82.2" height="14" rx="3" fill="#252525" stroke="none"/>
<text x="334.5" y="461" font-size="10" text-anchor="middle" fill="#8f8f8f">digging deeper</text>
<rect x="626.0999999999999" y="664.5016000000003" width="129.9" height="14" rx="3" fill="#252525" stroke="none"/>
<text x="691.05" y="674.5016000000003" font-size="10" text-anchor="middle" fill="#8f8f8f">returns to human nature</text>
</g>
</svg>