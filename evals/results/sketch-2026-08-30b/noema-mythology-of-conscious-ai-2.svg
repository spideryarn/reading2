<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 591.9" width="760" height="591.9">
<style>text { font-family: "Geist", "Helvetica Neue", Arial, sans-serif; }</style>
<rect x="0" y="0" width="760" height="591.9" fill="#252525"/>
<text x="16" y="24" font-size="17" fill="#f7f7f7" font-weight="600">Why It's Probably Not There</text><text x="16" y="42" font-size="11.5" fill="#b8b8b8">The assumed premise (computation suffices) is challenged by four independent arguments, two of them carrying a specific</text>
<text x="16" y="56.95" font-size="11.5" fill="#b8b8b8">worked example, all converging on the same verdict.</text>
<g transform="translate(0 71.9)">
<path d="M380 100 C380 120 109 120 109 140" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="109,140 105.5,130 112.5,130" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M380 100 C380 120 289 120 289 140" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="289,140 285.5,130 292.5,130" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M380 100 C380 120 469 120 469 140" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="469,140 465.5,130 472.5,130" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M380 100 C380 120 649 120 649 140" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="649,140 645.5,130 652.5,130" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M109 230 L109 260" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
<polygon points="109,260 105.5,250 112.5,250" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M649 230 L649 260" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
<polygon points="649,260 645.5,250 652.5,250" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M109 230 C109 306.5 380 323.5 380 400" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="380,400 376.5,390 383.5,390" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M289 230 C289 306.5 380 323.5 380 400" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="380,400 376.5,390 383.5,390" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M469 230 C469 306.5 380 323.5 380 400" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="380,400 376.5,390 383.5,390" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M649 230 C649 306.5 380 323.5 380 400" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="380,400 376.5,390 383.5,390" fill="rgba(201,201,201,0.8)" stroke="none"/>
<g>
<title>Assumes computation = consciousness — Computational functionalism is the load-bearing assumption behind conscious AI.</title>
<polygon points="380,30 530,65 380,100 230,65" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="69.875" font-size="15" text-anchor="middle" fill="#f7f7f7">Assumes computation = consciousness</text>
</g>
<g>
<title>Brains aren't computers — No clean split between wetware and mindware, unlike hardware and software.</title>
<rect x="34" y="140" width="150" height="90" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="109" y="181.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Brains aren't</text>
<text x="109" y="196.4" font-size="12" text-anchor="middle" fill="#f7f7f7">computers</text>
</g>
<g>
<title>More than algorithms — Continuous, stochastic, dynamical processes lie outside Turing computation.</title>
<rect x="214" y="140" width="150" height="90" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="289" y="188.9" font-size="12" text-anchor="middle" fill="#f7f7f7">More than algorithms</text>
</g>
<g>
<title>Life may be necessary — Predictive self-regulation ties conscious feeling to living, metabolizing bodies.</title>
<rect x="394" y="140" width="150" height="90" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="469" y="188.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Life may be necessary</text>
</g>
<g>
<title>Simulating ≠ creating — A simulation of digestion digests nothing; a simulated brain may feel nothing.</title>
<rect x="574" y="140" width="150" height="90" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="649" y="188.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Simulating ≠ creating</text>
</g>
<g>
<title>Neuron swap fails — can't replace with silicon — Chalmers' replacement thought experiment fails at its first hurdle.</title>
<path d="M34 260 L170 260 L184 274 L184 350 L34 350 Z" fill="rgba(47,191,149,0.09)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M170 260 L170 274 L184 274" fill="none" stroke="rgba(47,191,149,0.5)" stroke-width="1"/>
<text x="109" y="302.4" font-size="10" text-anchor="middle" fill="#f7f7f7">Neuron swap fails</text>
<text x="109" y="316.25" font-size="9" text-anchor="middle" fill="#8f8f8f">can't replace with silicon</text>
</g>
<g>
<title>Needs same assumption — Bostrom's hidden premise — The simulation hypothesis quietly assumes a program can be conscious.</title>
<path d="M574 260 L710 260 L724 274 L724 350 L574 350 Z" fill="rgba(47,191,149,0.09)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M710 260 L710 274 L724 274" fill="none" stroke="rgba(47,191,149,0.5)" stroke-width="1"/>
<text x="649" y="302.4" font-size="10" text-anchor="middle" fill="#f7f7f7">Needs same assumption</text>
<text x="649" y="316.25" font-size="9" text-anchor="middle" fill="#8f8f8f">Bostrom's hidden premise</text>
</g>
<g>
<title>Functionalism looks shaky — Not disproof — but four independent lines all point the same way.</title>
<polygon points="270,400 490,400 530,440 490,480 270,480 230,440" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="380" y="444.875" font-size="15" text-anchor="middle" fill="#f7f7f7">Functionalism looks shaky</text>
</g>
</g>
</svg>