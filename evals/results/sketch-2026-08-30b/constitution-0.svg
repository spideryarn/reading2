<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1051.9" width="760" height="1051.9">
<style>text { font-family: "Geist", "Helvetica Neue", Arial, sans-serif; }</style>
<rect x="0" y="0" width="760" height="1051.9" fill="#252525"/>
<text x="16" y="24" font-size="17" fill="#f7f7f7" font-weight="600">Constitution: mission → four values → elaborated in turn → nature → close</text><text x="16" y="42" font-size="11.5" fill="#b8b8b8">One mission fans into four values held in holistic (not strict) priority; the body then elaborates them in the opposite</text>
<text x="16" y="56.95" font-size="11.5" fill="#b8b8b8">order, before turning to Claude's nature and closing by hoping Claude recognizes itself in the whole.</text>
<g transform="translate(0 71.9)">
