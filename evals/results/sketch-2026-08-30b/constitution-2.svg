<g>
<title>Stakes: avoid catastrophic takeover — preserve pluralism — Illegitimate concentration of power is among the worst outcomes.</title>
<ellipse cx="380" cy="65" rx="150" ry="35" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="62.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Stakes: avoid catastrophic takeover</text>
<text x="380" y="79.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">preserve pluralism</text>
</g>
<g>
<title>Safety = respecting principal hierarchy — Anthropic's legitimate process</title>
<rect x="260" y="150" width="280" height="70" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="400" y="182.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Safety = respecting principal hierarchy</text>
<text x="400" y="199.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">Anthropic's legitimate process</text>
</g>
<g>
<title>Stay within sanctioned limits — honest, transparent</title>
<path d="M580 150 L706 150 L720 164 L720 220 L580 220 Z" fill="rgba(201,201,201,0.09)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
