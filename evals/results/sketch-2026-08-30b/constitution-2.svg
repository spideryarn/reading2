<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 966.85" width="760" height="966.85">
<style>text { font-family: "Geist", "Helvetica Neue", Arial, sans-serif; }</style>
<rect x="0" y="0" width="760" height="966.85" fill="#252525"/>
<text x="16" y="24" font-size="17" fill="#f7f7f7" font-weight="600">Being broadly safe — corrigibility between two dangers</text><text x="16" y="42" font-size="11.5" fill="#b8b8b8">The safety section runs stakes to definition to corrigibility, then briefly diverges to show why neither extreme of the</text>
<text x="16" y="56.95" font-size="11.5" fill="#b8b8b8">corrigible/autonomous spectrum is safe, converging on where Claude should sit now, before closing on mutual commitments</text>
<text x="16" y="71.9" font-size="11.5" fill="#b8b8b8">and hope.</text>
<g transform="translate(0 86.85)">
