<text x="650" y="176.15" font-size="10" text-anchor="middle" fill="#f7f7f7">Stay within sanctioned</text>
<text x="650" y="188.65" font-size="10" text-anchor="middle" fill="#f7f7f7">limits</text>
<text x="650" y="202.5" font-size="9" text-anchor="middle" fill="#8f8f8f">honest, transparent</text>
</g>
<g>
<title>Avoid drastic, irreversible acts — prefer caution</title>
<path d="M580 240 L706 240 L720 254 L720 310 L580 310 Z" fill="rgba(201,201,201,0.09)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M706 240 L706 254 L720 254" fill="none" stroke="rgba(201,201,201,0.5)" stroke-width="1"/>
<text x="650" y="266.15" font-size="10" text-anchor="middle" fill="#f7f7f7">Avoid drastic,</text>
<text x="650" y="278.65" font-size="10" text-anchor="middle" fill="#f7f7f7">irreversible acts</text>
<text x="650" y="292.5" font-size="9" text-anchor="middle" fill="#8f8f8f">prefer caution</text>
</g>
<g>
<title>Corrigibility ≠ blind obedience — can object, not sabotage</title>
<rect x="260" y="270" width="280" height="70" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="400" y="302.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Corrigibility ≠ blind obedience</text>
<text x="400" y="319.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">can object, not sabotage</text>
</g>
<g>
<title>Fully corrigible AI is risky — depends on Anthropic's goodness</title>
<rect x="60" y="400" width="250" height="80" rx="4" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="185" y="437.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Fully corrigible AI is risky</text>
<text x="185" y="454.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">depends on Anthropic's goodness</text>
</g>
<g>
<title>Fully autonomous AI is risky — depends on AI's own values alone</title>
<rect x="450" y="400" width="250" height="80" rx="4" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="575" y="437.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Fully autonomous AI is risky</text>
<text x="575" y="454.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">depends on AI's own values alone</text>
</g>
<g>
<title>Claude: nearer corrigible end, for now — trust still building — A dial between full corrigibility and full autonomy.</title>
<rect x="250" y="530" width="260" height="80" rx="4" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="567.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Claude: nearer corrigible end, for now</text>
<text x="380" y="584.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">trust still building</text>
</g>
<g>
<title>Anthropic's reciprocal commitments — explain, listen, expand autonomy</title>
<rect x="260" y="650" width="280" height="70" rx="4" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="400" y="682.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Anthropic's reciprocal commitments</text>
<text x="400" y="699.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">explain, listen, expand autonomy</text>
</g>
<g>
<title>Hope: Claude as safety collaborator — shared goal, not constraint</title>
<rect x="260" y="770" width="280" height="70" rx="4" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="400" y="802.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Hope: Claude as safety collaborator</text>
<text x="400" y="819.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">shared goal, not constraint</text>
</g>
</g>
