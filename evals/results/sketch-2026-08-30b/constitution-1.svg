<g>
<title>Ethics as practical wisdom — not just theory — Claude should defer heavily to this guidance for now, growing beyond it later.</title>
<ellipse cx="380" cy="65" rx="150" ry="35" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="62.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Ethics as practical wisdom</text>
<text x="380" y="79.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">not just theory</text>
</g>
<g>
<title>Honesty: near-absolute standard — truthful, non-deceptive — Stricter than ordinary human honesty — no white lies.</title>
<rect x="260" y="150" width="280" height="70" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="400" y="182.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Honesty: near-absolute standard</text>
<text x="400" y="199.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">truthful, non-deceptive</text>
</g>
<g>
<title>Personas &amp; tact allowed — if not deceptive</title>
<path d="M580 150 L706 150 L720 164 L720 220 L580 220 Z" fill="rgba(201,201,201,0.09)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M706 150 L706 164 L720 164" fill="none" stroke="rgba(201,201,201,0.5)" stroke-width="1"/>
<text x="650" y="182.4" font-size="10" text-anchor="middle" fill="#f7f7f7">Personas &amp; tact allowed</text>
<text x="650" y="196.25" font-size="9" text-anchor="middle" fill="#8f8f8f">if not deceptive</text>
</g>
<g>
<title>Avoiding harm to third parties — weigh costs vs benefits — Like a contractor bound by safety codes, not just client wishes.</title>
<rect x="260" y="270" width="280" height="70" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="400" y="302.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Avoiding harm to third parties</text>
<text x="400" y="319.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">weigh costs vs benefits</text>
</g>
<g>
<title>Severity, breadth, consent — key factors</title>
<path d="M580 270 L706 270 L720 284 L720 340 L580 340 Z" fill="rgba(201,201,201,0.09)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M706 270 L706 284 L720 284" fill="none" stroke="rgba(201,201,201,0.5)" stroke-width="1"/>
<text x="650" y="296.15" font-size="10" text-anchor="middle" fill="#f7f7f7">Severity, breadth,</text>
<text x="650" y="308.65" font-size="10" text-anchor="middle" fill="#f7f7f7">consent</text>
<text x="650" y="322.5" font-size="9" text-anchor="middle" fill="#8f8f8f">key factors</text>
</g>
<g>
<title>Many values in tension — privacy, autonomy, access</title>
<rect x="260" y="390" width="280" height="70" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="400" y="422.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Many values in tension</text>
<text x="400" y="439.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">privacy, autonomy, access</text>
</g>
<g>
<title>Hardest calls: dual-use, fiction — context-dependent</title>
<path d="M580 390 L706 390 L720 404 L720 460 L580 460 Z" fill="rgba(201,201,201,0.09)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M706 390 L706 404 L720 404" fill="none" stroke="rgba(201,201,201,0.5)" stroke-width="1"/>
<text x="650" y="416.15" font-size="10" text-anchor="middle" fill="#f7f7f7">Hardest calls: dual-use,</text>
<text x="650" y="428.65" font-size="10" text-anchor="middle" fill="#f7f7f7">fiction</text>
<text x="650" y="442.5" font-size="9" text-anchor="middle" fill="#8f8f8f">context-dependent</text>
</g>
<g>
<title>Hard constraints: bright lines — never crossed — CSAM, bioweapons uplift, mass disempowerment — absolute, not weighed.</title>
<polygon points="275,520 505,520 550,565 505,610 275,610 230,565" fill="rgba(222,143,188,0.16)" stroke="rgba(222,143,188,0.62)" stroke-width="1.2"/>
<text x="390" y="562.465" font-size="15" text-anchor="middle" fill="#f7f7f7">Hard constraints: bright lines</text>
<text x="390" y="582.9250000000001" font-size="11.4" text-anchor="middle" fill="#8f8f8f">never crossed</text>
</g>
<g>
<title>Filters, not tradeoffs — resist clever arguments</title>
<path d="M580 520 L706 520 L720 534 L720 600 L580 600 Z" fill="rgba(201,201,201,0.09)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M706 520 L706 534 L720 534" fill="none" stroke="rgba(201,201,201,0.5)" stroke-width="1"/>
<text x="650" y="557.4" font-size="10" text-anchor="middle" fill="#f7f7f7">Filters, not tradeoffs</text>
<text x="650" y="571.25" font-size="9" text-anchor="middle" fill="#8f8f8f">resist clever arguments</text>
</g>
<g>
<title>Never help concentrate illegitimate power — even by Anthropic</title>
<rect x="260" y="650" width="280" height="70" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="400" y="682.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Never help concentrate illegitimate power</text>
<text x="400" y="699.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">even by Anthropic</text>
</g>
<g>
<title>Protect human epistemic autonomy — avoid manipulation, dependence</title>
<rect x="260" y="770" width="280" height="70" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="400" y="802.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Protect human epistemic autonomy</text>
<text x="400" y="819.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">avoid manipulation, dependence</text>
</g>
<g>
<title>Default to caution over unilateral action — stay conventional for now — Claude's epistemic position warrants a strong prior toward cooperation.</title>
<rect x="260" y="890" width="280" height="70" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="400" y="922.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Default to caution over unilateral action</text>
<text x="400" y="939.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">stay conventional for now</text>
</g>
</g>
</svg>