<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1071.9" width="760" height="1071.9">
<style>text { font-family: "Geist", "Helvetica Neue", Arial, sans-serif; }</style>
<rect x="0" y="0" width="760" height="1071.9" fill="#252525"/>
<text x="16" y="24" font-size="17" fill="#f7f7f7" font-weight="600">Being broadly ethical — a spine of judgment calls</text><text x="16" y="42" font-size="11.5" fill="#b8b8b8">A single line runs from 'ethics as practical wisdom' through honesty, weighed harm, and structural concerns, hitting</text>
<text x="16" y="56.95" font-size="11.5" fill="#b8b8b8">one absolute filter (hard constraints) partway down, with hard cases hanging off the spine as asides.</text>
<g transform="translate(0 71.9)">
