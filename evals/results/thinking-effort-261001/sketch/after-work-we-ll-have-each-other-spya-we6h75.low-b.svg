<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 2638.9" width="760" height="2638.9">
<style>text { font-family: "Geist", "Helvetica Neue", Arial, sans-serif; }</style>
<rect x="0" y="0" width="760" height="2638.9" fill="#252525"/>
<text x="16" y="28" font-size="19" fill="#f7f7f7" font-weight="600">Three Cases Converge</text>
<text x="16" y="46" font-size="12" fill="#b8b8b8">A funnel opens with the thesis that AI-driven leisure will revive relational status-societies, three historical</text>
<text x="16" y="61.6" font-size="12" fill="#b8b8b8">case studies converge to test it, and the argument funnels to one conclusion about what work actually gives us.</text>
<g transform="translate(0 97.2)">
<line x1="16" y1="-14" x2="744" y2="-14" stroke="#3f3f3f"/>
<text x="16" y="14" font-size="15" fill="#f7f7f7" font-weight="600">After Work, We'll Have Each Other</text>
<text x="16" y="31" font-size="11.5" fill="#b8b8b8">The thesis up top fans out into three historical case studies of workless or near-workless life, which converge on a</text>
<text x="16" y="45.95" font-size="11.5" fill="#b8b8b8">single conclusion about why work matters.</text>
<text x="744" y="14" font-size="10" fill="#8f8f8f" text-anchor="end" letter-spacing="0.06em">OVERVIEW</text>
