<g>
<title>If AI ends necessary work, relationships (not jobs) will supply status and meaning — The relational-sector thesis the author sets out to test. — → spya-eq7rkm</title>
<ellipse cx="380" cy="70" rx="160" ry="40" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="56.125" font-size="15" text-anchor="middle" fill="#f7f7f7">If AI ends necessary work,</text>
<text x="380" y="74.875" font-size="15" text-anchor="middle" fill="#f7f7f7">relationships (not jobs) will</text>
<text x="380" y="93.625" font-size="15" text-anchor="middle" fill="#f7f7f7">supply status and meaning</text>
</g>
<g>
<title>Versailles court: petty, status-obsessed — → spya-y827zc</title>
