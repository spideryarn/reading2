<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 3154.5" width="760" height="3154.5">
<style>text { font-family: "Geist", "Helvetica Neue", Arial, sans-serif; }</style>
<rect x="0" y="0" width="760" height="3154.5" fill="#252525"/>
<text x="16" y="28" font-size="19" fill="#f7f7f7" font-weight="600">Natural-to-artificial spinning chain</text>
<text x="16" y="46" font-size="12" fill="#b8b8b8">A chain down the page: the article moves from what silk is and how it behaves, through its ecological uses and the</text>
<text x="16" y="61.6" font-size="12" fill="#b8b8b8">glands that make it, to how spiders spin it naturally, how humans try to copy that, and finally what humans do</text>
<text x="16" y="77.2" font-size="12" fill="#b8b8b8">with it.</text>
<g transform="translate(0 112.80000000000001)">
<line x1="16" y1="-14" x2="744" y2="-14" stroke="#3f3f3f"/>
<text x="16" y="14" font-size="15" fill="#f7f7f7" font-weight="600">Spider silk: from gland to synthetic copy</text>
<text x="16" y="31" font-size="11.5" fill="#b8b8b8">A single chain of stages: properties set up uses and types, uses and types are explained by glands, glands explain</text>
<text x="16" y="45.95" font-size="11.5" fill="#b8b8b8">natural spinning, which artificial synthesis tries (and struggles) to copy, feeding into human applications.</text>
<text x="744" y="14" font-size="10" fill="#8f8f8f" text-anchor="end" letter-spacing="0.06em">OVERVIEW</text>
<g transform="translate(0 65.9)"><g>
<title>Silk: a protein fibre spiders spin for many jobs — → spya-gp4t9x</title>
<ellipse cx="380" cy="65" rx="100" ry="35" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="51.125" font-size="15" text-anchor="middle" fill="#f7f7f7">Silk: a protein</text>
<text x="380" y="69.875" font-size="15" text-anchor="middle" fill="#f7f7f7">fibre spiders spin</text>
<text x="380" y="88.625" font-size="15" text-anchor="middle" fill="#f7f7f7">for many jobs</text>
</g>
<g>
<title>Structure gives strength, toughness, stretch, adhesion — beta-sheets + amorphous matrix — → spya-py9zw6</title>
<rect x="260" y="140" width="240" height="80" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="380" y="168.09" font-size="15" text-anchor="middle" fill="#f7f7f7">Structure gives strength,</text>
<text x="380" y="186.84" font-size="15" text-anchor="middle" fill="#f7f7f7">toughness, stretch, adhesion</text>
<text x="380" y="207.3" font-size="11.4" text-anchor="middle" fill="#8f8f8f">beta-sheets + amorphous matrix</text>
</g>
<g>
<title>Used for trapping, mating, nesting, dispersal, food — → spya-rty5kb</title>
<rect x="60" y="270" width="220" height="80" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="170" y="306.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Used for trapping, mating,</text>
<text x="170" y="321.4" font-size="12" text-anchor="middle" fill="#f7f7f7">nesting, dispersal, food</text>
</g>
<g>
<title>Seven silk types, one per gland, one per job — → spya-hg7j7e</title>
<rect x="480" y="270" width="220" height="80" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="590" y="306.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Seven silk types, one per gland,</text>
<text x="590" y="321.4" font-size="12" text-anchor="middle" fill="#f7f7f7">one per job</text>
</g>
<g>
<title>A silk's job traces back to its gland — → spya-bgtqr0</title>
<rect x="260" y="380" width="240" height="70" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="380" y="411.4" font-size="12" text-anchor="middle" fill="#f7f7f7">A silk's job traces back to its</text>
<text x="380" y="426.4" font-size="12" text-anchor="middle" fill="#f7f7f7">gland</text>
</g>
<g>
<title>Natural spinning: pulled, not squeezed, through a tapering duct — liquid crystal to solid fibre — → spya-g3h8qq</title>
<polygon points="305,490 455,490 500,535 455,580 305,580 260,535" fill="rgba(240,228,66,0.16)" stroke="rgba(240,228,66,0.62)" stroke-width="1.2"/>
<text x="380" y="513.715" font-size="15" text-anchor="middle" fill="#f7f7f7">Natural spinning:</text>
<text x="380" y="532.465" font-size="15" text-anchor="middle" fill="#f7f7f7">pulled, not squeezed,</text>
<text x="380" y="551.215" font-size="15" text-anchor="middle" fill="#f7f7f7">through a tapering…</text>
<text x="380" y="571.6750000000001" font-size="11.4" text-anchor="middle" fill="#8f8f8f">liquid crystal to solid…</text>
</g>
<g>
<title>Artificial synthesis copies feedstock and spinning conditions — still thicker, weaker than natural — → spya-d7d7m8</title>
<polygon points="305,640 455,640 500,685 455,730 305,730 260,685" fill="rgba(240,228,66,0.16)" stroke="rgba(240,228,66,0.62)" stroke-width="1.2"/>
<text x="380" y="663.715" font-size="15" text-anchor="middle" fill="#f7f7f7">Artificial synthesis</text>
<text x="380" y="682.465" font-size="15" text-anchor="middle" fill="#f7f7f7">copies feedstock and</text>
<text x="380" y="701.215" font-size="15" text-anchor="middle" fill="#f7f7f7">spinning conditions</text>
<text x="380" y="721.6750000000001" font-size="11.4" text-anchor="middle" fill="#8f8f8f">still thicker, weaker than…</text>
</g>
<g>
<title>Decades of research mapped the chemistry — → spya-jvxbb8</title>
<path d="M560 640 L706 640 L720 654 L720 710 L560 710 Z" fill="rgba(201,201,201,0.09)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M706 640 L706 654 L720 654" fill="none" stroke="rgba(201,201,201,0.5)" stroke-width="1"/>
<text x="640" y="672" font-size="10" text-anchor="middle" fill="#f7f7f7">Decades of research mapped</text>
<text x="640" y="684.5" font-size="10" text-anchor="middle" fill="#f7f7f7">the chemistry</text>
</g>
<g>
<title>Engineered bacteria, yeast, goats, silkworms make silk-like protein — → spya-j7hems</title>
<rect x="260" y="790" width="240" height="70" rx="4" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="821.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Engineered bacteria, yeast, goats,</text>
<text x="380" y="836.4" font-size="12" text-anchor="middle" fill="#f7f7f7">silkworms make silk-like protein</text>
</g>
<g>
<title>Humans weave, heal, and build instruments with it — → spya-chy97m</title>
<rect x="260" y="910" width="240" height="80" rx="4" fill="rgba(92,143,232,0.16)" stroke="rgba(92,143,232,0.62)" stroke-width="1.2"/>
<text x="380" y="945.5" font-size="15" text-anchor="middle" fill="#f7f7f7">Humans weave, heal, and</text>
<text x="380" y="964.25" font-size="15" text-anchor="middle" fill="#f7f7f7">build instruments with it</text>
</g>
<g>
<title>Medicine: wound dressing, nerve regrowth — → spya-ce0yqp</title>
<path d="M40 1020 L226 1020 L240 1034 L240 1090 L40 1090 Z" fill="rgba(201,201,201,0.09)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M226 1020 L226 1034 L240 1034" fill="none" stroke="rgba(201,201,201,0.5)" stroke-width="1"/>
<text x="140" y="1052" font-size="10" text-anchor="middle" fill="#f7f7f7">Medicine: wound dressing, nerve</text>
<text x="140" y="1064.5" font-size="10" text-anchor="middle" fill="#f7f7f7">regrowth</text>
</g>
<g>
<title>Crosshairs, lenses, fusion-target supports — → spya-vr82sv</title>
<path d="M280 1020 L466 1020 L480 1034 L480 1090 L280 1090 Z" fill="rgba(201,201,201,0.09)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M466 1020 L466 1034 L480 1034" fill="none" stroke="rgba(201,201,201,0.5)" stroke-width="1"/>
<text x="380" y="1052" font-size="10" text-anchor="middle" fill="#f7f7f7">Crosshairs, lenses, fusion-target</text>
<text x="380" y="1064.5" font-size="10" text-anchor="middle" fill="#f7f7f7">supports</text>
</g>
<g>
<title>References &amp; related topics — → spya-jdybu5</title>
<text x="630" y="1048.25" font-size="10" text-anchor="middle" fill="#f7f7f7">References &amp; related topics</text>
</g></g>
</g>
<g transform="translate(0 1386.7)">
<line x1="16" y1="-14" x2="744" y2="-14" stroke="#3f3f3f"/>
<text x="16" y="14" font-size="15" fill="#f7f7f7" font-weight="600">Structure, uses, and types</text>
<text x="16" y="31" font-size="11.5" fill="#b8b8b8">A hub: silk's layered structure is the central fact, with its mechanical consequences, ecological uses, and the</text>
<text x="16" y="45.95" font-size="11.5" fill="#b8b8b8">specialised silk types all branching from it and converging again on which gland made which silk.</text>
<text x="744" y="14" font-size="10" fill="#8f8f8f" text-anchor="end" letter-spacing="0.06em">INSIDE-PROPERTIES</text>
<g transform="translate(0 65.9)"><g>
<title>Crystalline beta-sheets in an amorphous matrix — → spya-p263u9</title>
<ellipse cx="390" cy="70" rx="110" ry="40" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="390" y="65.5" font-size="15" text-anchor="middle" fill="#f7f7f7">Crystalline beta-sheets</text>
<text x="390" y="84.25" font-size="15" text-anchor="middle" fill="#f7f7f7">in an amorphous matrix</text>
</g>
<g>
<title>High strength + high stretch = exceptional toughness — → spya-nwva2u</title>
<rect x="40" y="160" width="210" height="80" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="145" y="196.4" font-size="12" text-anchor="middle" fill="#f7f7f7">High strength + high stretch =</text>
<text x="145" y="211.4" font-size="12" text-anchor="middle" fill="#f7f7f7">exceptional toughness</text>
</g>
<g>
<title>Attachment discs polymerise instantly into glue-like bonds — → spya-m8z9e7</title>
<rect x="280" y="160" width="210" height="80" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="385" y="196.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Attachment discs polymerise</text>
<text x="385" y="211.4" font-size="12" text-anchor="middle" fill="#f7f7f7">instantly into glue-like bonds</text>
</g>
<g>
<title>Wet silk shrinks up to 50%, re-tensioning webs — → spya-qdjb0x</title>
<path d="M520 160 L706 160 L720 174 L720 240 L520 240 Z" fill="rgba(201,201,201,0.09)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M706 160 L706 174 L720 174" fill="none" stroke="rgba(201,201,201,0.5)" stroke-width="1"/>
<text x="620" y="197" font-size="10" text-anchor="middle" fill="#f7f7f7">Wet silk shrinks up to 50%,</text>
<text x="620" y="209.5" font-size="10" text-anchor="middle" fill="#f7f7f7">re-tensioning webs</text>
</g>
<g>
<title>Trapping, mating, dispersal, nesting, alarm, pheromone trails — → spya-jyg3uw</title>
<rect x="40" y="300" width="300" height="90" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="190" y="341.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Trapping, mating, dispersal, nesting, alarm,</text>
<text x="190" y="356.4" font-size="12" text-anchor="middle" fill="#f7f7f7">pheromone trails</text>
</g>
<g>
<title>Dragline, capture-spiral, wrapping, egg-sac, glue, attachment silks — → spya-gu2z3s</title>
<rect x="420" y="300" width="300" height="90" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="570" y="341.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Dragline, capture-spiral, wrapping, egg-sac,</text>
<text x="570" y="356.4" font-size="12" text-anchor="middle" fill="#f7f7f7">glue, attachment silks</text>
</g>
<g>
<title>Each gland (ampullate, flagelliform, tubuliform...) makes one silk for one job — → spya-nprqdc</title>
<rect x="200" y="440" width="360" height="90" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="380" y="481.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Each gland (ampullate, flagelliform, tubuliform...)</text>
<text x="380" y="496.4" font-size="12" text-anchor="middle" fill="#f7f7f7">makes one silk for one job</text>
</g>
<g>
<title>Species vary in gland number and specialisation — → spya-nn5s8z</title>
<path d="M200 580 L546 580 L560 594 L560 660 L200 660 Z" fill="rgba(201,201,201,0.09)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M546 580 L546 594 L560 594" fill="none" stroke="rgba(201,201,201,0.5)" stroke-width="1"/>
<text x="380" y="623.25" font-size="10" text-anchor="middle" fill="#f7f7f7">Species vary in gland number and specialisation</text>
</g></g>
</g>
<g transform="translate(0 2240.6)">
<line x1="16" y1="-14" x2="744" y2="-14" stroke="#3f3f3f"/>
<text x="16" y="14" font-size="15" fill="#f7f7f7" font-weight="600">Spinning: natural then artificial</text>
<text x="16" y="31" font-size="11.5" fill="#b8b8b8">A chain followed by two columns: the natural spinning process runs step by step down the gland, and then artificial</text>
<text x="16" y="45.95" font-size="11.5" fill="#b8b8b8">synthesis sits beside it as an attempted copy, split into matching feedstock and matching geometry.</text>
<text x="744" y="14" font-size="10" fill="#8f8f8f" text-anchor="end" letter-spacing="0.06em">INSIDE-SPINNING</text>
<g transform="translate(0 65.9)"><g>
<title>Silk is pulled out on demand, not grown or pushed — → spya-g2gw42</title>
<ellipse cx="380" cy="65" rx="120" ry="35" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="60.5" font-size="15" text-anchor="middle" fill="#f7f7f7">Silk is pulled out on</text>
<text x="380" y="79.25" font-size="15" text-anchor="middle" fill="#f7f7f7">demand, not grown or pushed</text>
</g>
<g>
<title>Tail secretes the silk proteins — → spya-f29a84</title>
<rect x="260" y="130" width="240" height="60" rx="4" fill="rgba(240,228,66,0.16)" stroke="rgba(240,228,66,0.62)" stroke-width="1.2"/>
<text x="380" y="163.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Tail secretes the silk proteins</text>
</g>
<g>
<title>Ampulla stores the liquid silk dope — → spya-jezt06</title>
<rect x="260" y="210" width="240" height="60" rx="4" fill="rgba(240,228,66,0.16)" stroke="rgba(240,228,66,0.62)" stroke-width="1.2"/>
<text x="380" y="243.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Ampulla stores the liquid silk dope</text>
</g>
<g>
<title>Tapering duct: shear, acid, water removal align and solidify it — → spya-ba6knb</title>
<rect x="260" y="290" width="240" height="70" rx="4" fill="rgba(240,228,66,0.16)" stroke="rgba(240,228,66,0.62)" stroke-width="1.2"/>
<text x="380" y="321.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Tapering duct: shear, acid, water</text>
<text x="380" y="336.4" font-size="12" text-anchor="middle" fill="#f7f7f7">removal align and solidify it</text>
</g>
<g>
<title>A valve may regulate thickness, rejoin breaks — → spya-s5073r</title>
<path d="M540 290 L696 290 L710 304 L710 360 L540 360 Z" fill="rgba(201,201,201,0.09)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M696 290 L696 304 L710 304" fill="none" stroke="rgba(201,201,201,0.5)" stroke-width="1"/>
<text x="625" y="322" font-size="10" text-anchor="middle" fill="#f7f7f7">A valve may regulate</text>
<text x="625" y="334.5" font-size="10" text-anchor="middle" fill="#f7f7f7">thickness, rejoin breaks</text>
</g>
<g>
<title>One garden spider: 800+ glands of six kinds — → spya-zrcs7h</title>
<path d="M20 290 L196 290 L210 304 L210 370 L20 370 Z" fill="rgba(201,201,201,0.09)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M196 290 L196 304 L210 304" fill="none" stroke="rgba(201,201,201,0.5)" stroke-width="1"/>
<text x="115" y="327" font-size="10" text-anchor="middle" fill="#f7f7f7">One garden spider: 800+ glands of</text>
<text x="115" y="339.5" font-size="10" text-anchor="middle" fill="#f7f7f7">six kinds</text>
</g>
<g>
<title>Copying the protein feedstock: E. coli, silkworms, goats, plants — → spya-rw0wtg</title>
<rect x="120" y="440" width="230" height="90" rx="4" fill="rgba(92,143,232,0.16)" stroke="rgba(92,143,232,0.62)" stroke-width="1.2"/>
<text x="235" y="481.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Copying the protein feedstock: E.</text>
<text x="235" y="496.4" font-size="12" text-anchor="middle" fill="#f7f7f7">coli, silkworms, goats, plants</text>
</g>
<g>
<title>Copying the duct: syringes, microfluidics, electrospinning — → spya-x4bwhf</title>
<rect x="410" y="440" width="230" height="90" rx="4" fill="rgba(92,143,232,0.16)" stroke="rgba(92,143,232,0.62)" stroke-width="1.2"/>
<text x="525" y="481.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Copying the duct: syringes,</text>
<text x="525" y="496.4" font-size="12" text-anchor="middle" fill="#f7f7f7">microfluidics, electrospinning</text>
</g>
<g>
<title>Artificial fibres: thicker, weaker than natural dragline — → spya-jzcepa</title>
<rect x="260" y="580" width="240" height="90" rx="4" fill="rgba(92,143,232,0.16)" stroke="rgba(92,143,232,0.62)" stroke-width="1.2"/>
<text x="380" y="620.5" font-size="15" text-anchor="middle" fill="#f7f7f7">Artificial fibres: thicker,</text>
<text x="380" y="639.25" font-size="15" text-anchor="middle" fill="#f7f7f7">weaker than natural dragline</text>
</g>
<g>
<title>Still, commercial spidroin products now exist — → spya-m99ub7</title>
<path d="M260 710 L486 710 L500 724 L500 780 L260 780 Z" fill="rgba(201,201,201,0.09)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M486 710 L486 724 L500 724" fill="none" stroke="rgba(201,201,201,0.5)" stroke-width="1"/>
<text x="380" y="742" font-size="10" text-anchor="middle" fill="#f7f7f7">Still, commercial spidroin products now</text>
<text x="380" y="754.5" font-size="10" text-anchor="middle" fill="#f7f7f7">exist</text>
</g></g>
</g>
</svg>