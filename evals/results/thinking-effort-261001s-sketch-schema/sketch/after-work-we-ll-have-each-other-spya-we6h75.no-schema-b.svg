<line x1="16" y1="-14" x2="744" y2="-14" stroke="#3f3f3f"/>
<text x="16" y="14" font-size="15" fill="#f7f7f7" font-weight="600">Power and sex among apes</text>
<text x="16" y="31" font-size="11.5" fill="#b8b8b8">Aristocrats freed from work organized life around precedence, gossip, and honor — a civilizing restraint on primate</text>
<text x="16" y="45.95" font-size="11.5" fill="#b8b8b8">instinct, not its inevitable form.</text>
<text x="744" y="14" font-size="10" fill="#8f8f8f" text-anchor="end" letter-spacing="0.06em">INSIDE-ARISTOCRATS</text>
