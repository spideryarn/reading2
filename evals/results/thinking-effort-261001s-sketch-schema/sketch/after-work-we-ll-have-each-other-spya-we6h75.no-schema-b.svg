<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 2478.9" width="760" height="2478.9">
<style>text { font-family: "Geist", "Helvetica Neue", Arial, sans-serif; }</style>
<rect x="0" y="0" width="760" height="2478.9" fill="#252525"/>
<text x="16" y="28" font-size="19" fill="#f7f7f7" font-weight="600">Three Cases Converging</text>
<text x="16" y="46" font-size="12" fill="#b8b8b8">A funnel opens into three parallel case studies of relational societies, which converge on the conclusion that</text>
<text x="16" y="61.6" font-size="12" fill="#b8b8b8">work supplies impersonal respect that relational life cannot.</text>
<g transform="translate(0 97.2)">
<line x1="16" y1="-14" x2="744" y2="-14" stroke="#3f3f3f"/>
<text x="16" y="14" font-size="15" fill="#f7f7f7" font-weight="600">After Work, We'll Have Each Other</text>
<text x="16" y="31" font-size="11.5" fill="#b8b8b8">The thesis (relationships replace work) funnels into three historical case studies of relational living, which converge</text>
<text x="16" y="45.95" font-size="11.5" fill="#b8b8b8">on a single conclusion about what work really gives us.</text>
<text x="744" y="14" font-size="10" fill="#8f8f8f" text-anchor="end" letter-spacing="0.06em">OVERVIEW</text>
