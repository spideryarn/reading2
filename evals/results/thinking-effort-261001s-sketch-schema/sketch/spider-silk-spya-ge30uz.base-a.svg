<polygon points="380,550 376.5,540 383.5,540" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M380 630 L380 700" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="380,700 376.5,690 383.5,690" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M380 780 L380 900" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="380,900 376.5,890 383.5,890" fill="rgba(201,201,201,0.8)" stroke="none"/>
<path d="M380 970 L380 1010" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="380,1010 376.5,1000 383.5,1000" fill="rgba(201,201,201,0.8)" stroke="none"/>
<g>
<title>Silk serves many spider needs — prey, shelter, mating, flight — → spya-gp4t9x</title>
<ellipse cx="380" cy="65" rx="120" ry="35" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="62.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Silk serves many spider needs</text>
<text x="380" y="79.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">prey, shelter, mating, flight</text>
</g>
<g>
<title>Structure gives strength, stretch, toughness, stickiness — → spya-py9zw6</title>
<rect x="280" y="180" width="200" height="80" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="380" y="208.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Structure gives strength,</text>
<text x="380" y="223.9" font-size="12" text-anchor="middle" fill="#f7f7f7">stretch, toughness,</text>
<text x="380" y="238.9" font-size="12" text-anchor="middle" fill="#f7f7f7">stickiness</text>
</g>
<g>
<title>Different silks for different jobs — capture, wrap, nest, drift, signal — → spya-rty5kb</title>
<rect x="280" y="350" width="200" height="70" rx="4" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="375.472" font-size="12" text-anchor="middle" fill="#f7f7f7">Different silks for different</text>
<text x="380" y="390.472" font-size="12" text-anchor="middle" fill="#f7f7f7">jobs</text>
<text x="380" y="406.84" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">capture, wrap, nest, drift, signal</text>
</g>
<g>
<title>Seven glands, seven silks — each tied to a use — → spya-hg7j7e</title>
<rect x="280" y="450" width="200" height="70" rx="4" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="482.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Seven glands, seven silks</text>
<text x="380" y="499.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">each tied to a use</text>
</g>
<g>
<title>Spun on demand through a tapering duct — liquid to solid fibre — → spya-g3h8qq</title>
<polygon points="320,550 440,550 480,590 440,630 320,630 280,590" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="580.472" font-size="12" text-anchor="middle" fill="#f7f7f7">Spun on demand through a</text>
<text x="380" y="595.472" font-size="12" text-anchor="middle" fill="#f7f7f7">tapering duct</text>
<text x="380" y="611.84" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">liquid to solid fibre</text>
</g>
<g>
<title>Copying silk means copying both protein and duct — → spya-d7d7m8</title>
<rect x="280" y="700" width="200" height="80" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="380" y="736.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Copying silk means copying</text>
<text x="380" y="751.4" font-size="12" text-anchor="middle" fill="#f7f7f7">both protein and duct</text>
</g>
<g>
<title>Decades of research map silk's chemistry and spinning — → spya-jvxbb8</title>
<rect x="280" y="900" width="200" height="70" rx="4" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="931.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Decades of research map</text>
<text x="380" y="946.4" font-size="12" text-anchor="middle" fill="#f7f7f7">silk's chemistry and spinning</text>
</g>
<g>
<title>Humans harvest and apply silk — textiles, medicine, optics — → spya-chy97m</title>
<ellipse cx="380" cy="1050" rx="100" ry="40" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="1047.972" font-size="12" text-anchor="middle" fill="#f7f7f7">Humans harvest and apply silk</text>
<text x="380" y="1064.34" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">textiles, medicine, optics</text>
</g>
<text x="50" y="155" font-size="11" text-anchor="start" fill="rgba(232,112,58,0.95)" font-weight="500" letter-spacing="0.07em">PROPERTIES</text>
<text x="50" y="675" font-size="11" text-anchor="start" fill="rgba(47,191,149,0.95)" font-weight="500" letter-spacing="0.07em">ARTIFICIAL SYNTHESIS</text></g>
</g>
<g transform="translate(0 1371.1000000000001)">
<line x1="16" y1="-14" x2="744" y2="-14" stroke="#3f3f3f"/>
<text x="16" y="14" font-size="15" fill="#f7f7f7" font-weight="600">Properties of spider silk</text>
<text x="16" y="31" font-size="11.5" fill="#b8b8b8">Three sides of one material: its molecular build, the mechanical traits that build gives it, and a separate adhesive</text>
<text x="16" y="45.95" font-size="11.5" fill="#b8b8b8">trick used only at attachment points.</text>
<text x="744" y="14" font-size="10" fill="#8f8f8f" text-anchor="end" letter-spacing="0.06em">INSIDE-PROPERTIES</text>
<g transform="translate(0 65.9)"><path d="M145 150 L145 200" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
