<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 2818.9" width="760" height="2818.9">
<style>text { font-family: "Geist", "Helvetica Neue", Arial, sans-serif; }</style>
<rect x="0" y="0" width="760" height="2818.9" fill="#252525"/>
<text x="16" y="28" font-size="19" fill="#f7f7f7" font-weight="600">Chain with two expansions</text>
<text x="16" y="46" font-size="12" fill="#b8b8b8">A chain down the page: the article moves from what silk is and does, through how spiders make it, to how humans</text>
<text x="16" y="61.6" font-size="12" fill="#b8b8b8">try to copy it and finally use it.</text>
<g transform="translate(0 97.2)">
<line x1="16" y1="-14" x2="744" y2="-14" stroke="#3f3f3f"/>
<text x="16" y="14" font-size="15" fill="#f7f7f7" font-weight="600">Spider silk overview</text>
<text x="16" y="31" font-size="11.5" fill="#b8b8b8">One spine from biology to engineering to human use; properties and artificial synthesis are the two densest links,</text>
<text x="16" y="45.95" font-size="11.5" fill="#b8b8b8">expanded below.</text>
<text x="744" y="14" font-size="10" fill="#8f8f8f" text-anchor="end" letter-spacing="0.06em">OVERVIEW</text>
<g transform="translate(0 65.9)"><rect x="40" y="140" width="680" height="170" rx="8" fill="rgba(232,112,58,0.07)" stroke="rgba(232,112,58,0.24)" stroke-width="1"/>
