<path d="M380 390 L380 450" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1.5 3.5"/>
<g>
<title>Hard crystal sheets in a stretchy amorphous matrix — → spya-p263u9</title>
<rect x="40" y="60" width="210" height="90" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="145" y="101.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Hard crystal sheets in a</text>
<text x="145" y="116.4" font-size="12" text-anchor="middle" fill="#f7f7f7">stretchy amorphous matrix</text>
</g>
<g>
<title>Stronger than steel, tougher than Kevlar, weight for weight — → spya-nwva2u</title>
<rect x="280" y="60" width="200" height="80" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="380" y="88.9" font-size="12" text-anchor="middle" fill="#f7f7f7">Stronger than steel, tougher</text>
<text x="380" y="103.9" font-size="12" text-anchor="middle" fill="#f7f7f7">than Kevlar, weight for</text>
<text x="380" y="118.9" font-size="12" text-anchor="middle" fill="#f7f7f7">weight</text>
</g>
<g>
<title>Low stiffness (Young's modulus) vs steel/Kevlar — → spya-dq9b7q</title>
<rect x="40" y="200" width="210" height="70" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="145" y="231.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Low stiffness (Young's modulus)</text>
<text x="145" y="246.4" font-size="12" text-anchor="middle" fill="#f7f7f7">vs steel/Kevlar</text>
</g>
<g>
<title>Tensile strength rivals alloy steel — → spya-mhe2r5</title>
<rect x="280" y="200" width="200" height="70" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="380" y="231.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Tensile strength rivals alloy</text>
<text x="380" y="246.4" font-size="12" text-anchor="middle" fill="#f7f7f7">steel</text>
</g>
<g>
<title>Extreme toughness, e.g. Darwin's bark spider — → spya-ug9bz2</title>
<rect x="520" y="60" width="180" height="80" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="610" y="96.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Extreme toughness, e.g.</text>
<text x="610" y="111.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Darwin's bark spider</text>
</g>
<g>
<title>Stretches up to 5x length before breaking — → spya-n93h2f</title>
<rect x="40" y="320" width="210" height="70" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="145" y="351.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Stretches up to 5x length</text>
<text x="145" y="366.4" font-size="12" text-anchor="middle" fill="#f7f7f7">before breaking</text>
</g>
<g>
<title>Shrinks 50% when wet (supercontraction) — → spya-qdjb0x</title>
<rect x="280" y="320" width="200" height="70" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="380" y="351.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Shrinks 50% when wet</text>
<text x="380" y="366.4" font-size="12" text-anchor="middle" fill="#f7f7f7">(supercontraction)</text>
</g>
<g>
<title>Holds strength from -40°C to 220°C — → spya-v6hmg4</title>
<rect x="520" y="200" width="180" height="70" rx="4" fill="rgba(232,112,58,0.16)" stroke="rgba(232,112,58,0.62)" stroke-width="1.2"/>
<text x="610" y="231.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Holds strength from -40°C</text>
<text x="610" y="246.4" font-size="12" text-anchor="middle" fill="#f7f7f7">to 220°C</text>
</g>
<g>
<title>Separately: attachment discs glue instantly, biodegradably — → spya-m8z9e7</title>
<polygon points="305,450 455,450 500,495 455,540 305,540 260,495" fill="rgba(240,228,66,0.16)" stroke="rgba(240,228,66,0.62)" stroke-width="1.2"/>
<text x="380" y="491.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Separately: attachment discs glue</text>
<text x="380" y="506.4" font-size="12" text-anchor="middle" fill="#f7f7f7">instantly, biodegradably</text>
</g></g>
</g>
<g transform="translate(0 2085)">
<line x1="16" y1="-14" x2="744" y2="-14" stroke="#3f3f3f"/>
<text x="16" y="14" font-size="15" fill="#f7f7f7" font-weight="600">Artificial synthesis</text>
<text x="16" y="31" font-size="11.5" fill="#b8b8b8">Two separate problems must both be solved — the protein feedstock and the spinning apparatus — before they converge on</text>
<text x="16" y="45.95" font-size="11.5" fill="#b8b8b8">usable synthetic silk and its other applications.</text>
<text x="744" y="14" font-size="10" fill="#8f8f8f" text-anchor="end" letter-spacing="0.06em">INSIDE-ARTIFICIAL</text>
<g transform="translate(0 65.9)"><path d="M170 150 C170 181.5 380 188.5 380 220" fill="none" stroke="rgba(201,201,201,0.62)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
