<g>
<title>Feedstock: extract silk-like proteins from E. coli, silkworms, goats — → spya-rw0wtg</title>
<rect x="40" y="60" width="260" height="90" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="170" y="101.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Feedstock: extract silk-like proteins</text>
<text x="170" y="116.4" font-size="12" text-anchor="middle" fill="#f7f7f7">from E. coli, silkworms, goats</text>
</g>
<g>
<title>Geometry: syringes, microfluidics, electrospinning mimic the duct — → spya-x4bwhf</title>
<rect x="460" y="60" width="260" height="90" rx="4" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="590" y="101.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Geometry: syringes, microfluidics,</text>
<text x="590" y="116.4" font-size="12" text-anchor="middle" fill="#f7f7f7">electrospinning mimic the duct</text>
</g>
<g>
<title>Both needed together for a working fibre — → spya-d7d7m8</title>
<polygon points="380,220 510,270 380,320 250,270" fill="rgba(47,191,149,0.16)" stroke="rgba(47,191,149,0.62)" stroke-width="1.2"/>
<text x="380" y="266.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Both needed together for a</text>
<text x="380" y="281.4" font-size="12" text-anchor="middle" fill="#f7f7f7">working fibre</text>
</g>
<g>
<title>Also: capsules, nanowires, membranes for medicine — → spya-r4r9au</title>
<path d="M40 380 L286 380 L300 394 L300 460 L40 460 Z" fill="rgba(201,201,201,0.09)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M286 380 L286 394 L300 394" fill="none" stroke="rgba(201,201,201,0.5)" stroke-width="1"/>
<text x="170" y="416.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Also: capsules, nanowires, membranes</text>
<text x="170" y="431.4" font-size="12" text-anchor="middle" fill="#f7f7f7">for medicine</text>
</g>
<g>
<title>Companies/labs: AMSilk, Bolt Threads, Spiber, Kraig, Nexia — → spya-j7hems</title>
<rect x="460" y="380" width="260" height="90" rx="4" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="590" y="421.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Companies/labs: AMSilk, Bolt Threads,</text>
<text x="590" y="436.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Spiber, Kraig, Nexia</text>
</g>
<g>
<title>Still thicker, weaker than natural dragline silk — → spya-jzcepa</title>
<rect x="250" y="520" width="260" height="80" rx="4" fill="rgba(240,228,66,0.16)" stroke="rgba(240,228,66,0.62)" stroke-width="1.2"/>
<text x="380" y="556.4" font-size="12" text-anchor="middle" fill="#f7f7f7">Still thicker, weaker than natural</text>
<text x="380" y="571.4" font-size="12" text-anchor="middle" fill="#f7f7f7">dragline silk</text>
</g></g>
</g>
