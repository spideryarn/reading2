<path d="M560 870 L716 870 L730 884 L730 940 L560 940 Z" fill="rgba(201,201,201,0.09)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.5"/>
