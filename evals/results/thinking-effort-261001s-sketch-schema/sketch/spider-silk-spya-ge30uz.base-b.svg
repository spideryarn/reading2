<text x="380" y="79.25" font-size="15" text-anchor="middle" fill="#f7f7f7">needs</text>
</g>
<g>
<title>Structure gives strength, toughness, stickiness — → spya-py9zw6</title>
<rect x="280" y="180" width="200" height="70" rx="4" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
