<g>
<title>Silk serves many spider needs — Prey capture, protection, mobility, courtship, even food. — → spya-gp4t9x</title>
<ellipse cx="380" cy="65" rx="120" ry="35" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
