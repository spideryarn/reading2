<text x="380" y="666.4" font-size="12" text-anchor="middle" fill="#f7f7f7">fibre</text>
</g>
<g>
<title>Replicating it artificially is hard — feedstock + spinning geometry — → spya-d7d7m8</title>
<rect x="280" y="740" width="200" height="80" rx="4" fill="rgba(201,201,201,0.16)" stroke="rgba(201,201,201,0.62)" stroke-width="1.2"/>
<text x="380" y="770.472" font-size="12" text-anchor="middle" fill="#f7f7f7">Replicating it artificially</text>
<text x="380" y="785.472" font-size="12" text-anchor="middle" fill="#f7f7f7">is hard</text>
<text x="380" y="801.84" font-size="9.120000000000001" text-anchor="middle" fill="#8f8f8f">feedstock + spinning geometry</text>
</g>
