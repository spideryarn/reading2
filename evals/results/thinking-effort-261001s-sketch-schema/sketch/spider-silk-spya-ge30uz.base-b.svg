<text x="16" y="14" font-size="15" fill="#f7f7f7" font-weight="600">Properties: structure to function</text>
<text x="16" y="31" font-size="11.5" fill="#b8b8b8">A ladder: molecular structure underlies mechanical performance, which underlies the adhesive and ecological uses.</text>
<text x="744" y="14" font-size="10" fill="#8f8f8f" text-anchor="end" letter-spacing="0.06em">INSIDE-PROPERTIES</text>
