<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 2799.55" width="760" height="2799.55">
<style>text { font-family: "Geist", "Helvetica Neue", Arial, sans-serif; }</style>
<rect x="0" y="0" width="760" height="2799.55" fill="#252525"/>
<text x="16" y="28" font-size="19" fill="#f7f7f7" font-weight="600">Chain with asides</text>
<text x="16" y="46" font-size="12" fill="#b8b8b8">The article is a chain running from what silk is and does, through its natural properties and manufacture, to</text>
<text x="16" y="61.6" font-size="12" fill="#b8b8b8">human attempts to copy and use it — with a research-history aside hanging off the middle and reference matter at</text>
<text x="16" y="77.2" font-size="12" fill="#b8b8b8">the end.</text>
<g transform="translate(0 112.80000000000001)">
<line x1="16" y1="-14" x2="744" y2="-14" stroke="#3f3f3f"/>
<text x="16" y="14" font-size="15" fill="#f7f7f7" font-weight="600">Spider silk: from web to lab</text>
<text x="16" y="31" font-size="11.5" fill="#b8b8b8">A main line runs top to bottom from biology to human imitation; research history and back matter hang off it as asides</text>
<text x="16" y="45.95" font-size="11.5" fill="#b8b8b8">rather than sitting on the line.</text>
<text x="744" y="14" font-size="10" fill="#8f8f8f" text-anchor="end" letter-spacing="0.06em">OVERVIEW</text>
