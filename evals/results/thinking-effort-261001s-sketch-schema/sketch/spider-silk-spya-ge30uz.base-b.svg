<text x="16" y="31" font-size="11.5" fill="#b8b8b8">A chain: the natural gland's process is the template that artificial synthesis tries, and fails, to fully match, with</text>
<text x="16" y="45.95" font-size="11.5" fill="#b8b8b8">research history tracking the chase.</text>
<text x="744" y="14" font-size="10" fill="#8f8f8f" text-anchor="end" letter-spacing="0.06em">INSIDE-SYNTHESIS</text>
