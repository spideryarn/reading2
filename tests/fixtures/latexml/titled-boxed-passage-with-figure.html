<span id="S2.SS2.SSS3.p15.pic1.1.1" class="ltx_p"><span id="S2.SS2.SSS3.p15.pic1.1.1.1" class="ltx_text ltx_font_bold">Box 3: Attention in neuroscience and in AI</span></span>
</span></span></span></foreignObject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignObject height="1116.77" overflow="visible" transform="matrix(1 0 0 -1 0 1114.08)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S2.SS2.SSS3.p15.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom">
<span id="S2.SS2.SSS3.p15.pic1.p1" class="ltx_para">
<span id="S2.SS2.SSS3.p15.pic1.p1.1" class="ltx_p"><span id="S2.SS2.SSS3.p15.pic1.p1.1.1" class="ltx_text">The fields of neuroscience and machine learning each have their own distinct concepts of attention (Lindsay 2020). In machine learning, several different forms of attention have been developed, but at present, the most common is “self-attention” (Vaswani et al. 2023). This is the mechanism at the heart of Transformer networks, which power large language models.</span></span>
</span>
<span id="S2.SS2.SSS3.p15.pic1.fig1" class="ltx_figure"><img src="2308.08708v3/figures/selfAttention.png" id="S2.SS2.SSS3.p15.pic1.g1" class="ltx_graphics ltx_centering ltx_img_portrait" width="218" height="284" alt="[Uncaptioned image]">
</span>
<span id="S2.SS2.SSS3.p15.pic1.p2" class="ltx_para">
<span id="S2.SS2.SSS3.p15.pic1.p2.1" class="ltx_p"><span id="S2.SS2.SSS3.p15.pic1.p2.1.1" class="ltx_text">In self-attention, representations of elements of an input sequence (for example, words in a sentence) are allowed to interact multiplicatively. Specifically, each <span id="S2.SS2.SSS3.p15.pic1.p2.1.1.1" class="ltx_text ltx_font_bold">word representation</span>, that is given as a vector is transformed into three new vectors: a <span id="S2.SS2.SSS3.p15.pic1.p2.1.1.2" class="ltx_text">query</span>, <span id="S2.SS2.SSS3.p15.pic1.p2.1.1.3" class="ltx_text">key</span>, and <span id="S2.SS2.SSS3.p15.pic1.p2.1.1.4" class="ltx_text">value</span>. The <span id="S2.SS2.SSS3.p15.pic1.p2.1.1.5" class="ltx_text">query</span> vector of one word is multiplied by the <span id="S2.SS2.SSS3.p15.pic1.p2.1.1.6" class="ltx_text">key</span> vectors of all other words to determine a <span id="S2.SS2.SSS3.p15.pic1.p2.1.1.7" class="ltx_text">weighting</span> for each of these words. This <span id="S2.SS2.SSS3.p15.pic1.p2.1.1.8" class="ltx_text">weighting</span> is applied to the <span id="S2.SS2.SSS3.p15.pic1.p2.1.1.9" class="ltx_text">value</span> vectors of these words; the sum of these <span id="S2.SS2.SSS3.p15.pic1.p2.1.1.10" class="ltx_text">weighted</span> <span id="S2.SS2.SSS3.p15.pic1.p2.1.1.11" class="ltx_text">value</span> vectors forms the new <span id="S2.SS2.SSS3.p15.pic1.p2.1.1.12" class="ltx_text ltx_font_bold">representation</span> of the word. This process is done in parallel for all words.

<br class="ltx_break">“Cross-attention” follows a similar formula but allows the query to be generated from one set of representations and the key and values to come from another (self-attention and cross-attention are both forms of “key-query attention”). This can be helpful, for example, in translation networks that use the words of the sentence being generated in the target language to guide attention toward the appropriate words of the sentence in the original language.

<br class="ltx_break">Key-query attention has only loose connections to how attention is conceptualised in neuroscience. Similar to self-attention, gain modulation (wherein attention multiplicatively scales neural activity) has been found in many neural systems (Treue &amp; Trujillo 1999, Reynolds &amp; Heeger 2009). However, this attentional modulation is frequently thought to arise from recurrent top-down connections, not from the parallel processing of concurrent inputs (Noudoost et al. 2010, Bichot et al. 2015). Previous versions of attention in machine learning have relied on recurrent processing, and in this way could be considered more similar to biological attention (Mnih et al. 2014, Bahdanau et al. 2014). However, it should be noted that there are many different flavors of attention within neuroscience and the underlying neural mechanisms may vary across them. Therefore, saying definitively which forms of artificial attention are closest to biological attention in general, is not straightforward.

<br class="ltx_break">Insofar as different theories of consciousness depend on recurrent processing or other specific components of the attention mechanism, self-attention may not be sufficient to form the basis of artificial consciousness. For example, there is nothing akin to the binary ignition process in global workspace theory in self-attention, as attention is implemented as a graded weighting of inputs. There is also no built-in model of the attention process on top of attention itself, as required in attention schema theory.</span></span>
