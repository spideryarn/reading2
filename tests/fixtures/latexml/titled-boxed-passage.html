<span id="S1.SS2.p5.pic1.1.1" class="ltx_p"><span id="S1.SS2.p5.pic1.1.1.1" class="ltx_text ltx_font_bold">Box 1: Determinacy, degrees, dimensions</span></span>
</span></span></span></foreignObject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignObject height="311.18" overflow="visible" transform="matrix(1 0 0 -1 0 308.49)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S1.SS2.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom">
<span id="S1.SS2.p5.pic1.2.1" class="ltx_p"><span id="S1.SS2.p5.pic1.2.1.1" class="ltx_text">In this report, we generally write as though consciousness is an all-or-nothing matter: a system either is conscious, or it isn’t. However, there are various other possibilities. There seem to be many properties that have “blurry” boundaries, in the sense that whether some object has that property may be indeterminate. For example, a shirt may be a colour somewhere on the borderline between yellow and green, such that there is no fact of the matter about whether it is yellow or not. In principle, consciousness could be like this: there could be creatures that are neither determinately conscious nor determinately non-conscious (Simon 2017, Schwitzgebel forthcoming). If this is the case, some AI systems could be in this “blurry” zone. This kind of indeterminacy arguably follows from materialism about consciousness (Birch 2022a).

<br class="ltx_break">Another possibility is that there could be degrees of consciousness so that it is possible for one system to be more conscious than another (Lee 2022). In this case, it might be possible to build AI systems that are conscious but only to a very slight degree, or even systems which are conscious to a much greater degree than humans (Shulman &amp; Bostrom 2021). Alternatively, rather than a single scale, it could be that consciousness varies along multiple dimensions (Birch et al. 2020).

<br class="ltx_break">Lastly, it could be that there are multiple elements of consciousness. These would not be necessary conditions for some further property of consciousness, but rather constituents which make up consciousness. These elements may be typically found together in humans, but separable in other animals or AI systems. In this case, it would be possible for a system to be partly conscious, in the sense of having some of these elements.</span></span>
</span></span></span></foreignObject></g></g></svg></span>
